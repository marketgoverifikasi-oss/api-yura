<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KiyomiApi's | Documents</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Quicksand:wght@500;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        mono: ['JetBrains Mono', 'monospace'],
                        sans: ['Quicksand', 'sans-serif']
                    },
                    colors: {
                        'neo-bg': '#f4f0ea',
                        'neo-yellow': '#ffeb85',
                        'neo-blue': '#b5fbff',  
                        'neo-pink': '#ffb0ef',   
                        'neo-red': '#ff8080',    
                        'neo-green': '#4ceb99',  
                        'neo-dark': '#2d3748'    
                    },
                    boxShadow: {
                        'neo': '3px 3px 0px 0px rgba(45,55,72,1)',
                        'neo-sm': '2px 2px 0px 0px rgba(45,55,72,1)',
                        'neo-lg': '6px 6px 0px 0px rgba(45,55,72,1)',
                        'neo-active': '0px 0px 0px 0px rgba(45,55,72,1)'
                    },
                    animation: {
                        blink: 'blink 1s step-end infinite',
                        fadeIn: 'fadeIn .25s ease-out forwards',
                        neoUp: 'neoUp .3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards'
                    },
                    keyframes: {
                        blink: {
                            '0%, 100%': { opacity: '1' },
                            '50%': { opacity: '0' }
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' }
                        },
                        neoUp: {
                            '0%': {
                                opacity: '0',
                                transform: 'translateY(15px) translateX(5px)'
                            },
                            '100%': {
                                opacity: '1',
                                transform: 'translateY(0) translateX(0)'
                            }
                        }
                    }
                }
            }
        };
    </script>

    <style>
        html, body {
            width: 100%;
            max-width: 100vw;
            min-height: 100%;
            overflow-x: hidden;
            background: #f4f0ea;
        }

        body {
            font-size: 13px;
        }

        #fixed-bg {
            position: fixed;
            inset: 0;
            z-index: -50;
            background: #f4f0ea;
            background-image: radial-gradient(#2d3748 1px, transparent 1px);
            background-size: 24px 24px;
            opacity: 0.1;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f4f0ea; border-left: 2px solid #2d3748; }
        ::-webkit-scrollbar-thumb { background: #ffeb85; border: 2px solid #2d3748; border-radius: 8px; }

        .json-key { color: #2d3748; font-weight: 800; }
        .json-string { color: #047857; font-weight: 700; }
        .json-number { color: #d946ef; font-weight: 800; }
        .json-boolean { color: #2563eb; font-weight: 800; }
        .json-null { color: #64748B; font-weight: 800; }

        .status-indicator {
            width: 12px;
            height: 12px;
            display: inline-block;
            border: 2px solid #2d3748;
            border-radius: 50%;
        }

        .status-waiting { background: #b5fbff; animation: blink 1.5s infinite; }
        .status-success { background: #4ceb99; }
        .status-error { background: #ff8080; }

        .sidebar-category-btn.active {
            background: #ffeb85 !important;
            box-shadow: 2px 2px 0px 0px rgba(45,55,72,1) !important;
            transform: translate(2px, 2px);
        }

        .copy-mini-btn {
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 0 10px;
            border: 2px solid #2d3748;
            background: #fff;
            color: #2d3748;
            font-size: 10px;
            font-weight: 800;
            border-radius: 8px;
            box-shadow: 2px 2px 0 0 #2d3748;
            transition: all 0.2s ease-out;
        }
        
        .copy-mini-btn:active {
            box-shadow: 0 0 0 0 #2d3748;
            transform: translate(2px, 2px);
        }

        .request-url-box {
            margin: 12px 12px 0;
            padding: 10px;
            background: #fff;
            border: 2px solid #2d3748;
            border-radius: 12px;
            box-shadow: 3px 3px 0 0 #2d3748;
        }

        .request-url-box .label {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 5px;
            color: #2d3748;
            font-size: 9px;
            font-weight: 800;
            letter-spacing: .1em;
            text-transform: uppercase;
        }

        .request-url-box code {
            display: block;
            max-height: 48px;
            overflow-y: auto;
            word-break: break-all;
            color: #2d3748;
            font-size: 10px;
            font-weight: 700;
            line-height: 1.45;
        }

        .response-output-box {
            margin: 12px;
            padding: 10px;
            min-height: 58px;
            max-height: 250px;
            overflow-y: auto;
            background: #fdfdfd;
            border: 2px solid #2d3748;
            border-radius: 12px;
            box-shadow: inset 3px 3px 0px 0px rgba(45,55,72,0.05);
        }

        /* EFEK KLIK (RIPPLE) */
        .click-ripple {
            position: fixed;
            width: 30px;
            height: 30px;
            background: rgba(255, 176, 239, 0.7);
            border: 2px solid #2d3748;
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0.5);
            animation: rippleAnim 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            z-index: 99999;
        }

        @keyframes rippleAnim {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(3); opacity: 0; }
        }

        button:active, a:active, .category-header-main:active, .api-card-head:active {
            transform: scale(0.98) translate(2px, 2px);
            transition: transform 0.1s;
        }

        /* ANIMASI ACCORDION MULUS */
        .accordion-wrapper {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .accordion-wrapper.open {
            grid-template-rows: 1fr;
        }
        .accordion-inner {
            overflow: hidden;
        }

        @media (max-width: 768px) {
            nav .max-w-7xl { height: 56px; padding-left: 12px; padding-right: 12px; }
            #nav-title { font-size: 18px; line-height: 1; }
            #nav-title + span { font-size: 8px; letter-spacing: .11em; }
            nav button { width: 38px !important; height: 38px !important; font-size: 14px; }
            main { display: block !important; padding: 12px 10px 24px !important; overflow: visible; }
            main > aside { position: relative !important; top: auto !important; margin-bottom: 12px; }
            #search-input { height: 46px; font-size: 13px; padding-left: 42px; padding-right: 14px; }
            .search-icon-mobile { left: 14px !important; top: 14px !important; font-size: 15px; }
            
            /* Jarak antar elemen diperkecil agar tidak renggang */
            #api-container { display: flex; flex-direction: column; gap: 10px; opacity: 1 !important; transform: none !important; }
            
            .api-section { scroll-margin-top: 70px; }
            .category-header-main { display: flex !important; margin-bottom: 0 !important; } 
            
            .api-section-grid { display: flex; flex-direction: column; gap: 10px !important; padding-top: 10px; }
            
            .api-card-head { padding: 12px !important; min-height: 62px; border-bottom: none; }
            .method-badge-mobile { width: 48px !important; padding: 6px 4px !important; font-size: 9px !important; }
            .api-card-wrapper code { font-size: 13px !important; line-height: 1.25; }
            .api-name-text { font-size: 10px !important; line-height: 1.25; }
            .params-box-mobile { padding: 12px !important; gap: 10px !important; }
            .api-card-wrapper label { font-size: 9px !important; margin-bottom: 4px; }
            .api-card-wrapper input { padding: 10px !important; font-size: 12px !important; }
            .status-guide-wrap { display: none !important; }
            .action-row-mobile { padding: 12px !important; gap: 10px !important; }
            .response-area { margin: 0 12px 12px !important; max-width: calc(100% - 24px) !important; }
            .response-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px; border-bottom: 2px solid #2d3748; background: #fff; }
            .response-meta { display: inline-flex; align-items: center; gap: 6px; padding: 4px 8px; border: 2px solid #2d3748; background: #fff; border-radius: 8px; box-shadow: 2px 2px 0 0 #2d3748; }
            .response-meta span { font-size: 9px !important; font-weight: 800; color: #2d3748 !important; }
            .response-action-grid { padding: 12px 12px 0 !important; gap: 8px !important; }
            #sidebar-menu { width: 280px; }
            #sidebar-menu .p-5 { padding: 16px; }
            #sidebar-menu h2 { font-size: 18px; }
            #sidebar-menu a { padding: 12px; font-size: 13px; }
            .sidebar-category-btn { padding: 10px 12px !important; font-size: 12px !important; }
        }

        .api-card-wrapper { position: relative; overflow: hidden; border-bottom: 2px solid #2d3748; }
        .api-section { scroll-margin-top: 90px; }
        body.sidebar-open { overflow: hidden; }

        @media (min-width: 1024px) {
            #api-container { gap: 16px; }
            .api-section-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding-top: 12px; }
        }

        @media (max-width: 768px) {
            main { padding-top: 80px !important; }
        }
    </style>
</head>

<body class="text-neo-dark min-h-screen flex flex-col font-sans selection:bg-neo-yellow selection:text-neo-dark">
    <div id="fixed-bg"></div>

    <nav class="fixed top-0 left-0 right-0 border-b-2 border-[#2d3748] bg-white z-[70] w-full">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center gap-4 justify-between">
        <div class="flex items-center gap-4 shrink-0">
            <button onclick="openSidebar()" class="w-10 h-10 bg-neo-pink text-neo-dark border-2 border-[#2d3748] rounded-xl flex items-center justify-center shadow-neo hover:shadow-neo-sm hover:translate-x-[2px] hover:translate-y-[2px] active:shadow-neo-active transition-all cursor-pointer">
                <i class="fa-solid fa-bars font-black text-lg"></i>
            </button>

            <div>
                <h1 id="nav-title" class="font-black text-2xl tracking-tight text-neo-dark uppercase">KiyomiApi's</h1>
                <span class="text-[10px] font-bold text-neo-dark bg-neo-yellow border-2 border-[#2d3748] rounded-md px-2 py-0.5 tracking-widest shadow-neo-sm">API DOCS</span>
            </div>
        </div>

        <div class="hidden md:flex flex-1 max-w-xl mx-auto h-8 items-center justify-center mx-4">
            <span id="running-text" class="text-neo-dark text-xs font-mono font-black uppercase tracking-widest bg-neo-blue border-2 border-[#2d3748] rounded-lg px-4 py-1.5 shadow-neo-sm">
                READY TO USE
            </span>
        </div>

        <div class="w-10 h-10 hidden md:block"></div>
    </div>
    </nav>

    <div id="sidebar-overlay" onclick="closeSidebar()" class="fixed inset-0 bg-[#2d3748]/40 z-[80] hidden animate-fadeIn"></div>

    <aside id="sidebar-menu" class="fixed top-0 left-0 h-full w-[300px] max-w-[85vw] bg-white z-[90] shadow-[8px_0_0_0_rgba(45,55,72,1)] border-r-2 border-[#2d3748] -translate-x-full transition-transform duration-300 ease-out">
        <div class="p-5 border-b-2 border-[#2d3748] flex items-center justify-between bg-neo-pink rounded-tr-2xl">
            <div>
                <h2 class="text-2xl font-black text-neo-dark">KiyomiApi's</h2>
                <p class="text-[10px] text-neo-dark font-black uppercase tracking-widest bg-white border-2 border-[#2d3748] rounded-md px-2 py-0.5 inline-block mt-1 shadow-neo-sm">Navigation</p>
            </div>

            <button onclick="closeSidebar()" class="w-10 h-10 border-2 border-[#2d3748] rounded-xl bg-white text-neo-dark hover:bg-neo-yellow shadow-neo hover:shadow-neo-sm hover:translate-x-[2px] hover:translate-y-[2px] active:shadow-none transition-all">
                <i class="fa-solid fa-xmark font-black text-lg"></i>
            </button>
        </div>

        <div class="p-5 space-y-4 overflow-y-auto h-[calc(100vh-90px)] custom-scrollbar">
            <a href="/" class="flex items-center gap-3 bg-white border-2 border-[#2d3748] rounded-xl shadow-neo px-4 py-3 font-black text-neo-dark hover:bg-neo-yellow hover:translate-x-[2px] hover:translate-y-[2px] hover:shadow-neo-sm transition-all">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </a>

            <div class="pt-2">
                <p class="text-[12px] text-neo-dark font-black uppercase tracking-widest px-1 mb-3 border-b-2 border-[#2d3748] pb-1">Categories</p>
                <div id="sidebar-categories" class="space-y-3"></div>
            </div>
        </div>
    </aside>

    <main class="flex-grow max-w-7xl mx-auto w-full px-3 py-6 grid lg:grid-cols-12 gap-5 items-start relative z-10 overflow-hidden mt-16">
        
        <!-- STATUS BAR TERPISAH (Waktu/Tanggal, Runtime, Baterai) -->
        <div class="lg:col-span-12 w-full animate-neoUp">
            <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
                <!-- Box Waktu & Tanggal -->
                <div class="bg-neo-yellow border-2 border-[#2d3748] rounded-xl p-3 shadow-neo flex items-center gap-3">
                    <div class="w-10 h-10 bg-white border-2 border-[#2d3748] rounded-lg flex items-center justify-center shrink-0">
                        <i class="fa-regular fa-clock text-xl text-neo-dark fa-spin-pulse"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="font-black text-sm md:text-base text-neo-dark truncate" id="live-time">00:00:00</div>
                        <div class="text-[9px] font-bold tracking-widest text-neo-dark uppercase truncate" id="live-date">Memuat...</div>
                    </div>
                </div>

                <!-- Box Runtime -->
                <div class="bg-neo-pink border-2 border-[#2d3748] rounded-xl p-3 shadow-neo flex items-center gap-3">
                    <div class="w-10 h-10 bg-white border-2 border-[#2d3748] rounded-lg flex items-center justify-center shrink-0">
                        <i class="fa-solid fa-stopwatch text-xl text-neo-dark"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="font-black text-sm md:text-base text-neo-dark truncate" id="page-runtime">00:00:00</div>
                        <div class="text-[9px] font-bold tracking-widest text-neo-dark uppercase truncate">RUNTIME SISTEM</div>
                    </div>
                </div>

                <!-- Box Baterai -->
                <div class="bg-neo-blue border-2 border-[#2d3748] rounded-xl p-3 shadow-neo flex items-center gap-3 col-span-2 md:col-span-1">
                    <div class="w-10 h-10 bg-white border-2 border-[#2d3748] rounded-lg flex items-center justify-center shrink-0">
                        <i class="fa-solid fa-battery-half text-xl text-neo-dark" id="battery-icon"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="font-black text-sm md:text-base text-neo-dark truncate" id="battery-status">--%</div>
                        <div class="text-[9px] font-bold tracking-widest text-neo-dark uppercase truncate">STATUS BATERAI</div>
                    </div>
                </div>
            </div>
        </div>

        <aside class="lg:col-span-4 lg:sticky lg:top-28 flex flex-col gap-4 h-fit z-40 w-full max-w-full animate-neoUp" style="animation-delay: 0.1s;">
            <div class="relative group">
                <input type="text" id="search-input" placeholder="Cari Feature..." class="w-full h-14 border-2 border-[#2d3748] rounded-xl px-4 pl-12 font-black text-sm text-neo-dark shadow-neo focus:outline-none focus:translate-y-[2px] focus:translate-x-[2px] focus:shadow-neo-sm transition-all placeholder:text-[#2d3748]/50 bg-white">
                <i class="fa-solid fa-magnifying-glass search-icon-mobile absolute left-4 top-4 text-neo-dark text-lg"></i>
            </div>
        </aside>

        <!-- CONTAINER API (Gap diperkecil) -->
        <section class="lg:col-span-8 min-h-[50vh] w-full max-w-full">
            <div id="api-container" class="opacity-0 translate-y-4 transition-all duration-500 w-full"></div>

            <div id="no-results" class="hidden flex-col items-center justify-center py-20 text-center">
                <div class="bg-white border-2 border-[#2d3748] rounded-2xl p-8 shadow-neo text-neo-dark">
                    <i class="fa-solid fa-box-open text-6xl mb-4 text-neo-pink"></i>
                    <p class="font-black text-xl uppercase">No Data Found</p>
                </div>
            </div>
        </section>
    </main>

    <div id="custom-toast" class="fixed bottom-8 right-8 z-[100] transform translate-y-32 opacity-0 transition-all duration-300">
        <div class="bg-white text-neo-dark border-2 border-[#2d3748] rounded-xl px-6 py-4 font-black text-sm shadow-neo flex items-center gap-4">
            <div class="w-8 h-8 bg-neo-green border-2 border-[#2d3748] rounded-full text-neo-dark flex items-center justify-center shadow-neo-sm">
                <i class="fa-solid fa-check"></i>
            </div>
            <span id="toast-message" class="tracking-wider">SUCCESS</span>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', init);

        let globalConfig = null;
        let toastTimeout;
        let activeCategoryId = 'all';

        // --- SISTEM RIPPLE CLICK EVENT ---
        document.addEventListener('mousedown', function(e) {
            const ripple = document.createElement('div');
            ripple.className = 'click-ripple';
            ripple.style.left = e.clientX + 'px';
            ripple.style.top = e.clientY + 'px';
            document.body.appendChild(ripple);
            
            setTimeout(() => {
                ripple.remove();
            }, 500);
        });

        // --- SISTEM WAKTU, TANGGAL & RUNTIME ---
        const pageLoadTime = Date.now();

        function updateLiveClock() {
            const now = new Date();
            const dateOpts = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
            const dateStr = now.toLocaleDateString('id-ID', dateOpts).toUpperCase();
            const timeStr = now.toLocaleTimeString('id-ID');
            
            const diffSec = Math.floor((now.getTime() - pageLoadTime) / 1000);
            const h = String(Math.floor(diffSec / 3600)).padStart(2, '0');
            const m = String(Math.floor((diffSec % 3600) / 60)).padStart(2, '0');
            const s = String(diffSec % 60).padStart(2, '0');
            const runtimeStr = `${h}:${m}:${s}`;

            const dateEl = document.getElementById('live-date');
            const timeEl = document.getElementById('live-time');
            const runEl = document.getElementById('page-runtime');
            
            if(dateEl) dateEl.innerText = dateStr;
            if(timeEl) timeEl.innerText = timeStr;
            if(runEl) runEl.innerText = runtimeStr;
        }
        setInterval(updateLiveClock, 1000);
        updateLiveClock();

        // --- SISTEM BATERAI ---
        async function initBattery() {
            if (navigator.getBattery) {
                try {
                    const battery = await navigator.getBattery();
                    const updateUI = () => {
                        const level = Math.round(battery.level * 100);
                        const batStr = level + '%' + (battery.charging ? ' ⚡ Mengisi' : '');
                        
                        let batClass = 'fa-solid text-xl text-neo-dark ';
                        if (battery.charging) {
                            batClass += 'fa-bolt'; 
                        } else if (level > 75) {
                            batClass += 'fa-battery-full';
                        } else if (level > 40) {
                            batClass += 'fa-battery-half';
                        } else {
                            batClass += 'fa-battery-quarter text-neo-red';
                        }

                        document.getElementById('battery-status').innerText = batStr;
                        document.getElementById('battery-icon').className = batClass;
                    };
                    updateUI();
                    battery.addEventListener('levelchange', updateUI);
                    battery.addEventListener('chargingchange', updateUI);
                } catch(e) {}
            }
        }
        initBattery();


        // --- FUNGSI BAWAAN ---
        function openSidebar() {
            document.getElementById('sidebar-overlay')?.classList.remove('hidden');
            document.getElementById('sidebar-menu')?.classList.remove('-translate-x-full');
            document.body.classList.add('sidebar-open');
        }

        function closeSidebar() {
            document.getElementById('sidebar-overlay')?.classList.add('hidden');
            document.getElementById('sidebar-menu')?.classList.add('-translate-x-full');
            document.body.classList.remove('sidebar-open');
        }

        async function init() {
            try {
                // Fallback sementara jika api belum connect backend
                const response = await fetch('/config').catch(()=>({
                    ok: true,
                    json: async () => ({
                        tags: {
                            "Ai Features": [
                                { method: "GET", endpoint: "/api/ai/chat", name: "AI Chat", params: [{name:"text"}] },
                                { method: "GET", endpoint: "/api/ai/image", name: "AI Image", params: [{name:"prompt"}] }
                            ],
                            "Anime": [
                                { method: "GET", endpoint: "/api/anime/search", name: "Cari Anime", params: [{name:"query"}] }
                            ],
                            "Downloader": [
                                { method: "GET", endpoint: "/api/dl/tiktok", name: "Tiktok", params: [{name:"url"}] }
                            ]
                        }
                    })
                }));

                if (!response.ok) throw new Error('Gagal mengambil /config: ' + response.status);

                globalConfig = await response.json();
                setUi(globalConfig);
                loadEnd(globalConfig.tags || {});
                setSearch();
                loadReminder();
                showReadyState();
            } catch (err) {
                showConfigError(err.message || 'Gagal memuat data API.');
            }
        }

        function showReadyState() {
            const container = document.getElementById('api-container');
            if (!container) return;
            container.classList.remove('opacity-0', 'translate-y-4');
            container.classList.add('animate-neoUp');
        }

        function showConfigError(message) {
            const container = document.getElementById('api-container');
            if (!container) return;
            container.classList.remove('opacity-0', 'translate-y-4');
            container.innerHTML = `
                <div class="bg-white border-2 border-[#2d3748] rounded-2xl p-6 shadow-neo text-neo-dark font-bold text-sm leading-relaxed">
                    <div class="flex items-center gap-3 text-neo-red mb-3">
                        <i class="fa-solid fa-triangle-exclamation text-2xl"></i>
                        <span class="text-xl font-black uppercase text-neo-dark">System Error</span>
                    </div>
                    <p class="mb-2 bg-neo-red/20 p-2 rounded-lg border-l-4 border-neo-red">${escapeHtml(message)}</p>
                    <p class="font-black">Cek route <code class="bg-[#2d3748] text-white px-2 py-0.5 rounded-md">/config</code>.</p>
                </div>`;
        }

        async function loadReminder() {
            try {
                const req = await fetch('../src/reminder.json');
                const data = await req.json();
                if (data?.message) {
                    const runningText = document.getElementById('running-text');
                    if (runningText) runningText.innerText = 'READY TO USE';
                }
            } catch (e) {}
        }

        function setUi(config) {
            const s = config.settings || {};
            const navTitle = document.getElementById('nav-title');
            if (navTitle) navTitle.innerText = "KiyomiApi's";
            if (s.favicon) {
                let link = document.querySelector("link[rel~='icon']") || document.createElement('link');
                link.rel = 'icon';
                link.href = s.favicon;
                document.head.appendChild(link);
            }
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .split('&').join('&amp;')
                .split('<').join('&lt;')
                .split('>').join('&gt;')
                .split('"').join('&quot;')
                .split("'").join('&#039;');
        }

        function getDisplayFeature(value) {
            let text = String(value || '').trim().split('?')[0].replace(/^\/+|\/+$/g, '');
            const parts = text.split('/').filter(Boolean);
            let last = parts.length ? parts[parts.length - 1] : text;
            last = last.replace(/^api$/i, '').replace(/[-_]+/g, ' ').trim();
            return !last ? 'feature' : last.toLowerCase();
        }

        function getExampleValue(param) {
            const name = typeof param === 'string' ? param : (param?.name || '');
            const key = String(name || '').toLowerCase();
            if (key.includes('url') || key.includes('link')) return 'https://example.com';
            if (key.includes('text') || key === 'q' || key === 'query') return "Hello Kiyomi";
            return 'example';
        }

        // --- SISTEM ACCORDION MULUS (CATEGORY & ENDPOINT) ---
        function toggleAccordion(wrapperId, iconId) {
            const wrapper = document.getElementById(wrapperId);
            const icon = document.getElementById(iconId);
            
            if (!wrapper || !icon) return;

            if (wrapper.classList.contains('open')) {
                wrapper.classList.remove('open');
                icon.style.transform = 'rotate(0deg)';
                if (icon.parentElement.classList.contains('bg-neo-yellow')) {
                    icon.parentElement.classList.replace('bg-neo-yellow', 'bg-white');
                } else if(icon.classList.contains('fa-minus')) {
                    icon.classList.replace('fa-minus', 'fa-plus');
                }
            } else {
                wrapper.classList.add('open');
                icon.style.transform = 'rotate(180deg)';
                if (icon.parentElement.classList.contains('bg-white')) {
                    icon.parentElement.classList.replace('bg-white', 'bg-neo-yellow');
                } else if(icon.classList.contains('fa-plus')) {
                    icon.classList.replace('fa-plus', 'fa-minus');
                    icon.style.transform = 'rotate(0deg)'; // Biarkan minus lurus
                }
            }
        }

        function loadEnd(tags) {
            const container = document.getElementById('api-container');
            const sidebarCategories = document.getElementById('sidebar-categories');

            if (!container) return;
            container.innerHTML = '';

            const entries = Object.entries(tags || {}).sort((a, b) => a[0].localeCompare(b[0]));

            if (!entries.length) {
                container.innerHTML = `
                    <div class="bg-white border-2 border-[#2d3748] rounded-2xl p-6 shadow-neo text-neo-dark font-bold">
                        <div class="flex items-center gap-3 bg-neo-yellow border-2 border-[#2d3748] rounded-xl p-3 shadow-neo-sm">
                            <i class="fa-solid fa-circle-info text-xl"></i>
                            <span class="text-sm">Data endpoint kosong.</span>
                        </div>
                    </div>`;
                return;
            }

            if (sidebarCategories) {
                const allBtn = `
                    <button onclick="showAllCategories(this)" class="sidebar-category-btn active w-full flex items-center gap-3 bg-white border-2 border-[#2d3748] rounded-xl shadow-neo px-4 py-3 text-sm font-black text-neo-dark hover:bg-neo-yellow hover:translate-x-[2px] hover:translate-y-[2px] hover:shadow-neo-sm transition-all mb-3">
                        <i class="fa-solid fa-border-all text-[14px]"></i>
                        <span class="truncate">Semua</span>
                    </button>`;

                const categoryBtns = entries.map((item, idx) => {
                    const safeName = escapeHtml(item[0]);
                    return `
                        <button onclick="filterCategory('section-cat-${idx}', this)" class="sidebar-category-btn w-full flex items-center gap-3 bg-white border-2 border-[#2d3748] rounded-xl shadow-neo px-4 py-3 text-sm font-black text-neo-dark hover:bg-neo-yellow hover:translate-x-[2px] hover:translate-y-[2px] hover:shadow-neo-sm transition-all mb-3">
                            <i class="fa-solid fa-layer-group text-[14px]"></i>
                            <span class="truncate">${safeName}</span>
                        </button>`;
                }).join('');

                sidebarCategories.innerHTML = allBtn + categoryBtns;
            }

            entries.forEach(([cat, routes], catIndex) => {
                const section = document.createElement('div');
                section.id = 'section-cat-' + catIndex;
                section.className = 'api-section w-full mb-0';
                section.dataset.category = cat;

                const list = Array.isArray(routes) ? routes : [];

                section.innerHTML = `
                    <div class="category-header-main w-full bg-neo-blue border-2 border-[#2d3748] rounded-2xl shadow-neo p-4 cursor-pointer hover:bg-neo-yellow transition-colors flex justify-between items-center z-10 relative" onclick="toggleAccordion('cat-grid-wrap-${catIndex}', 'cat-icon-${catIndex}')">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 bg-white border-2 border-[#2d3748] rounded-xl flex items-center justify-center text-xl shadow-neo-sm shrink-0">
                                <i class="fa-solid fa-folder-open text-neo-pink"></i>
                            </div>
                            <div class="min-w-0">
                                <h2 class="text-lg font-black tracking-wide text-neo-dark uppercase truncate">${escapeHtml(cat)}</h2>
                                <p class="text-[11px] text-neo-dark bg-white border-2 border-[#2d3748] rounded-md px-2 py-0.5 mt-1 inline-block font-bold tracking-widest shadow-neo-sm">${list.length} ENDPOINTS</p>
                            </div>
                        </div>
                        <div class="w-8 h-8 bg-white border-2 border-[#2d3748] rounded-xl flex items-center justify-center shadow-neo-sm transition-all duration-300">
                            <i id="cat-icon-${catIndex}" class="fa-solid fa-chevron-down text-neo-dark transition-transform duration-300"></i>
                        </div>
                    </div>
                    <div id="cat-grid-wrap-${catIndex}" class="accordion-wrapper">
                        <div class="accordion-inner">
                            <div class="api-section-grid"></div>
                        </div>
                    </div>`;

                const grid = section.querySelector('.api-section-grid');

                list.forEach((route, idx) => {
                    const id = catIndex + '-' + idx;
                    const method = String(route.method || 'GET').toUpperCase();
                    const rawEndpoint = String(route.endpoint || '/');
                    const endpoint = rawEndpoint;
                    const name = getDisplayFeature(route.name || rawEndpoint);
                    const methodColor = method === 'GET' ? 'bg-neo-blue' : method === 'POST' ? 'bg-neo-pink' : 'bg-neo-red';
                    
                    let inputs = '';
                    if (Array.isArray(route.params) && route.params.length) {
                        inputs = '<div class="params-box-mobile bg-white p-4 border-b-2 border-[#2d3748] grid gap-3 w-full">' +
                            route.params.map(p => {
                                const inputId = ('input-' + id + '-' + p.name).replace(/\s+/g, '-');
                                const value = p.example || p.default || getExampleValue(p);
                                const placeholder = p.example || p.default || p.description || getExampleValue(p);
                                return `
                                    <div class="min-w-0">
                                        <label class="text-[10px] font-black text-neo-dark uppercase tracking-widest mb-1.5 flex items-center gap-1.5">
                                            <span class="w-1.5 h-1.5 bg-neo-dark rounded-full inline-block"></span>
                                            ${escapeHtml(p.name)} ${p.required ? '<span class="text-neo-red">*</span>' : ''}
                                        </label>
                                        <input type="text" id="${escapeHtml(inputId)}" data-param-name="${escapeHtml(p.name)}" placeholder="${escapeHtml(placeholder)}" value="${escapeHtml(value)}" class="w-full min-w-0 border-2 border-[#2d3748] p-2.5 text-xs font-bold rounded-lg focus:outline-none focus:bg-neo-yellow bg-white shadow-neo-sm focus:shadow-neo focus:translate-x-[-2px] focus:translate-y-[-2px] transition-all">
                                    </div>`;
                            }).join('') + '</div>';
                    }

                    const card = document.createElement('div');
                    card.className = 'api-card-wrapper w-full bg-white border-2 border-[#2d3748] rounded-2xl shadow-neo hover:shadow-neo-lg transition-all';
                    card.dataset.search = (name + ' ' + rawEndpoint + ' ' + cat).toLowerCase();

                    card.innerHTML = `
                        <div class="api-card-head p-3 cursor-pointer select-none hover:bg-[#faf7f2] transition-colors rounded-t-2xl z-10 relative bg-white" onclick="toggleAccordion('body-wrap-${id}', 'icon-${id}')">
                            <div class="flex justify-between items-center gap-2">
                                <div class="flex items-center gap-3 overflow-hidden min-w-0">
                                    <span class="method-badge-mobile px-2 py-1 text-[10px] font-black text-neo-dark ${methodColor} border-2 border-[#2d3748] rounded-lg font-mono tracking-wider w-14 text-center shadow-neo-sm shrink-0 uppercase">${escapeHtml(method)}</span>
                                    <div class="flex flex-col min-w-0">
                                        <code class="font-black text-[13px] sm:text-[15px] truncate font-mono text-neo-dark">${escapeHtml(name)}</code>
                                        <span class="api-name-text text-[10px] text-neo-dark font-bold truncate bg-neo-yellow border border-[#2d3748] rounded-md px-1.5 py-0.5 mt-1 inline-block w-fit shadow-[1px_1px_0px_0px_rgba(45,55,72,1)] uppercase tracking-wider">${escapeHtml(method)} feature</span>
                                    </div>
                                </div>
                                <div class="w-6 h-6 border-2 border-[#2d3748] rounded-md flex items-center justify-center bg-white shadow-[2px_2px_0px_0px_rgba(45,55,72,1)] shrink-0 transition-colors">
                                    <i id="icon-${id}" class="fa-solid fa-plus text-[10px] text-neo-dark transition-transform duration-300"></i>
                                </div>
                            </div>
                        </div>

                        <div id="body-wrap-${id}" class="accordion-wrapper border-t-2 border-[#2d3748] mt-[-2px]">
                            <div class="accordion-inner bg-[#fdfdfd]">
                                ${inputs}
                                <div class="action-row-mobile p-4 flex gap-3 w-full items-center">
                                    <button onclick="testReq(this, '${escapeHtml(endpoint)}', '${escapeHtml(method)}', '${id}')" class="flex-1 h-12 bg-neo-yellow border-2 border-[#2d3748] rounded-xl font-black text-xs tracking-widest shadow-neo hover:bg-[#facc15] active:shadow-none active:translate-x-[4px] active:translate-y-[4px] transition-all flex items-center justify-center gap-2 uppercase">
                                        <i class="fa-solid fa-bolt"></i> <span class="btn-text">Execute</span>
                                    </button>
                                </div>

                                <div id="res-area-${id}" class="response-area hidden mx-4 mb-4 border-2 border-[#2d3748] rounded-xl bg-white shadow-neo relative max-w-[calc(100%-2rem)] overflow-hidden">
                                    <div class="response-toolbar">
                                        <div class="flex items-center gap-2 text-neo-dark font-black text-xs uppercase tracking-widest">
                                            <span class="w-8 h-8 bg-[#2d3748] rounded-lg text-white flex items-center justify-center shadow-[2px_2px_0px_0px_#ffeb85]">
                                                <i class="fa-solid fa-code"></i>
                                            </span>
                                            <span>Result</span>
                                        </div>
                                        <div class="response-meta">
                                            <span id="status-indicator-${id}" class="status-indicator status-waiting"></span>
                                            <span id="status-${id}" class="text-[10px] font-mono font-black text-neo-dark tracking-widest">IDLE</span>
                                            <span id="time-${id}" class="text-[10px] font-mono font-bold text-neo-dark border-l-2 border-[#2d3748] pl-2 ml-1">0ms</span>
                                        </div>
                                    </div>
                                    <div class="request-url-box mt-2">
                                        <div class="label"><i class="fa-solid fa-laptop-code text-neo-blue"></i><span>Request URL</span></div>
                                        <code id="request-line-${id}">...</code>
                                    </div>
                                    <div class="response-output-box custom-scrollbar font-mono text-[11px] mb-3 mx-3 mt-2">
                                        <div id="output-${id}" class="text-neo-dark break-all whitespace-pre-wrap leading-relaxed"></div>
                                    </div>
                                </div>
                            </div>
                        </div>`;

                    grid.appendChild(card);
                });

                container.appendChild(section);
            });
        }

        function setActiveSidebarCategory(btn) {
            document.querySelectorAll('.sidebar-category-btn').forEach(el => el.classList.remove('active'));
            if (btn) btn.classList.add('active');
        }

        function showAllCategories(btn) {
            activeCategoryId = 'all';
            setActiveSidebarCategory(btn);
            document.querySelectorAll('.api-section').forEach(section => {
                section.classList.remove('hidden');
                // Tutup accordion category agar rapi saat kembali ke Semua
                const wrapId = section.id.replace('section-cat-', 'cat-grid-wrap-');
                const iconId = section.id.replace('section-cat-', 'cat-icon-');
                const wrap = document.getElementById(wrapId);
                const icon = document.getElementById(iconId);
                if(wrap && wrap.classList.contains('open')) {
                    wrap.classList.remove('open');
                    if(icon) icon.style.transform = 'rotate(0deg)';
                }
            });
            const input = document.getElementById('search-input');
            if (input) input.value = '';
            hideNoResults();
            closeSidebar();
        }

        function filterCategory(sectionId, btn) {
            activeCategoryId = sectionId;
            setActiveSidebarCategory(btn);
            
            document.querySelectorAll('.api-section').forEach(section => {
                section.classList.toggle('hidden', section.id !== sectionId);
                // Buka category yang dipilih
                if (section.id === sectionId) {
                    const wrapId = section.id.replace('section-cat-', 'cat-grid-wrap-');
                    const iconId = section.id.replace('section-cat-', 'cat-icon-');
                    const wrap = document.getElementById(wrapId);
                    const icon = document.getElementById(iconId);
                    if(wrap && !wrap.classList.contains('open')) {
                        wrap.classList.add('open');
                        if(icon) icon.style.transform = 'rotate(180deg)';
                    }
                }
            });
            const input = document.getElementById('search-input');
            if (input) input.value = '';
            hideNoResults();
            closeSidebar();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function hideNoResults() {
            document.getElementById('no-results')?.classList.add('hidden');
            document.getElementById('no-results')?.classList.remove('flex');
        }

        function showNoResults() {
            document.getElementById('no-results')?.classList.remove('hidden');
            document.getElementById('no-results')?.classList.add('flex');
        }

        function setSearch() {
            const input = document.getElementById('search-input');
            if (!input) return;

            input.addEventListener('input', e => {
                const val = e.target.value.toLowerCase().trim();
                let anyVisible = false;

                document.querySelectorAll('.api-section').forEach(section => {
                    const allowedByCategory = activeCategoryId === 'all' || section.id === activeCategoryId;
                    let matchCount = 0;

                    section.querySelectorAll('.api-card-wrapper').forEach(card => {
                        const match = !val || card.dataset.search.includes(val);
                        card.classList.toggle('hidden', !match);
                        if (match) matchCount++;
                    });

                    const sectionVisible = allowedByCategory && matchCount > 0;
                    section.classList.toggle('hidden', !sectionVisible);
                    
                    // Otomatis buka kategori jika ada yang cocok
                    if (sectionVisible) {
                        anyVisible = true;
                        if(val) {
                            const wrapId = section.id.replace('section-cat-', 'cat-grid-wrap-');
                            const iconId = section.id.replace('section-cat-', 'cat-icon-');
                            const wrap = document.getElementById(wrapId);
                            const icon = document.getElementById(iconId);
                            if(wrap && !wrap.classList.contains('open')) {
                                wrap.classList.add('open');
                                if(icon) icon.style.transform = 'rotate(180deg)';
                            }
                        }
                    }
                });
                anyVisible ? hideNoResults() : showNoResults();
            });
        }

        function messeg(msg) {
            const toast = document.getElementById('custom-toast');
            const msgBox = document.getElementById('toast-message');
            if (!toast || !msgBox) return;
            msgBox.innerText = msg;
            toast.classList.remove('translate-y-32', 'opacity-0');
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.add('translate-y-32', 'opacity-0'), 2500);
        }

        // --- SISTEM EXECUTE (FIXED FAST FETCH) ---
        async function testReq(btn, url, method, id) {
            if (btn.disabled) return;

            const out = document.getElementById('output-' + id);
            const status = document.getElementById('status-' + id);
            const time = document.getElementById('time-' + id);
            const resArea = document.getElementById('res-area-' + id);
            const statusIndicator = document.getElementById('status-indicator-' + id);

            if (!out || !status || !time || !resArea || !statusIndicator) return;

            const btnTextEl = btn.querySelector('.btn-text');
            const originalBtnText = btnTextEl.innerText;

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> <span class="btn-text">WAIT</span>';

            resArea.classList.remove('hidden', 'success', 'error');
            statusIndicator.className = 'status-indicator status-waiting';
            status.innerText = 'FETCHING';
            status.className = 'text-[10px] font-mono font-black text-neo-dark tracking-widest';
            out.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Processing...`;

            // Collect Params
            const params = {};
            document.querySelectorAll(`[id^="input-${id}-"]`).forEach(input => {
                if (input.value) params[input.dataset.paramName || input.id.split(`input-${id}-`)[1]] = input.value;
            });

            // Build URL langsung
            const queryStr = method === 'GET' && Object.keys(params).length ? '?' + new URLSearchParams(params).toString() : '';
            const fetchUrl = url + queryStr;
            const fullRequestUrl = window.location.origin + fetchUrl;
            
            const reqLine = document.getElementById('request-line-' + id);
            if (reqLine) {
                reqLine.innerText = method === 'GET' 
                    ? `curl -X GET "${fullRequestUrl}"` 
                    : `curl -X ${method} "${window.location.origin}${url}" -H "Content-Type: application/json" -d '${JSON.stringify(params)}'`;
            }

            const opts = {
                method: method,
                ...(method !== 'GET' && { headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(params) })
            };

            const start = Date.now();

            try {
                // FETCH LANGSUNG TANPA DELAY
                const req = await fetch(fetchUrl, opts);
                const duration = Date.now() - start;

                time.innerText = duration + 'ms';
                status.innerText = req.status + ' ' + req.statusText;

                if (req.ok) {
                    statusIndicator.className = 'status-indicator status-success';
                    status.className = 'text-[10px] font-mono font-black text-neo-dark bg-neo-green rounded-md px-2 tracking-widest';
                } else {
                    statusIndicator.className = 'status-indicator status-error';
                    status.className = 'text-[10px] font-mono font-black text-white bg-neo-red rounded-md px-2 tracking-widest';
                }

                const contentType = req.headers.get('content-type') || '';
                
                if (contentType.includes('application/json')) {
                    const json = await req.json();
                    out.innerHTML = syntaxHighlight(json);
                } else if (contentType.includes('image')) {
                    const blob = await req.blob();
                    out.innerHTML = `<img src="${URL.createObjectURL(blob)}" class="max-w-full max-h-[240px] rounded-lg border-2 border-[#2d3748] shadow-neo mx-auto">`;
                } else {
                    const text = await req.text();
                    out.innerHTML = escapeHtml(text.slice(0, 500)); // Limit view to prevent lag on huge HTML
                }
            } catch (err) {
                time.innerText = (Date.now() - start) + 'ms';
                statusIndicator.className = 'status-indicator status-error';
                status.innerText = 'ERROR';
                status.className = 'text-[10px] font-mono font-black text-white bg-neo-red rounded-md px-2 tracking-widest';
                out.innerHTML = `<span class="text-neo-red font-bold">Fetch Error: ${err.message}</span>`;
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-bolt"></i> <span class="btn-text">${originalBtnText}</span>`;
            }
        }

        function syntaxHighlight(json) {
            if (typeof json !== 'string') json = JSON.stringify(json, null, 2);
            return escapeHtml(json).replace(
                /(&quot;(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\&])*&quot;(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
                match => {
                    let cls = 'json-number';
                    if (match.startsWith('&quot;')) cls = match.endsWith(':') ? 'json-key' : 'json-string';
                    else if (match === 'true' || match === 'false') cls = 'json-boolean';
                    else if (match === 'null') cls = 'json-null';
                    return `<span class="${cls}">${match}</span>`;
                }
            );
        }
    </script>
