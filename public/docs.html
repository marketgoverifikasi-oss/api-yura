<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KiyomiApi's | Documents</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Quicksand:wght@500;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        mono: ['JetBrains Mono', 'monospace'],
                        sans: ['Quicksand', 'sans-serif']
                    },
                    colors: {
                        'neo-bg': '#f4f0ea',
                        'neo-yellow': '#ffeb85',
                        'neo-blue': '#b5fbff',  
                        'neo-pink': '#ffb0ef',   
                        'neo-red': '#ff8080',    
                        'neo-green': '#4ceb99',  
                        'neo-dark': '#2d3748'    
                    },
                    boxShadow: {
                        'neo': '3px 3px 0px 0px rgba(45,55,72,1)',
                        'neo-sm': '2px 2px 0px 0px rgba(45,55,72,1)',
                        'neo-lg': '6px 6px 0px 0px rgba(45,55,72,1)',
                        'neo-active': '0px 0px 0px 0px rgba(45,55,72,1)'
                    },
                    animation: {
                        blink: 'blink 1s step-end infinite',
                        fadeIn: 'fadeIn .25s ease-out forwards',
                        neoUp: 'neoUp .3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
                        marquee: 'marquee 25s linear infinite'
                    },
                    keyframes: {
                        blink: {
                            '0%, 100%': { opacity: '1' },
                            '50%': { opacity: '0' }
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' }
                        },
                        neoUp: {
                            '0%': {
                                opacity: '0',
                                transform: 'translateY(15px) translateX(5px)'
                            },
                            '100%': {
                                opacity: '1',
                                transform: 'translateY(0) translateX(0)'
                            }
                        },
                        marquee: {
                            '0%': { transform: 'translateX(0%)' },
                            '100%': { transform: 'translateX(-50%)' }
                        }
                    }
                }
            }
        };
    </script>

    <style>
        html, body {
            width: 100%;
            max-width: 100vw;
            min-height: 100%;
            overflow-x: hidden;
            background: #f4f0ea;
        }

        body {
            font-size: 13px;
        }

        /* Fixed Background pattern */
        #fixed-bg {
            position: fixed;
            inset: 0;
            z-index: -50;
            background: #f4f0ea;
            background-image: radial-gradient(#2d3748 1px, transparent 1px);
            background-size: 24px 24px;
            opacity: 0.1;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f4f0ea; border-left: 2px solid #2d3748; }
        ::-webkit-scrollbar-thumb { background: #ffeb85; border: 2px solid #2d3748; border-radius: 8px; }

        .json-key { color: #2d3748; font-weight: 800; }
        .json-string { color: #047857; font-weight: 700; }
        .json-number { color: #d946ef; font-weight: 800; }
        .json-boolean { color: #2563eb; font-weight: 800; }
        .json-null { color: #64748B; font-weight: 800; }

        .status-indicator {
            width: 12px;
            height: 12px;
            display: inline-block;
            border: 2px solid #2d3748;
            border-radius: 50%;
        }

        .status-waiting { background: #b5fbff; animation: blink 1.5s infinite; }
        .status-success { background: #4ceb99; }
        .status-error { background: #ff8080; }

        .sidebar-category-btn.active {
            background: #ffeb85 !important;
            box-shadow: 2px 2px 0px 0px rgba(45,55,72,1) !important;
            transform: translate(2px, 2px);
        }

        .copy-mini-btn {
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 0 10px;
            border: 2px solid #2d3748;
            background: #fff;
            color: #2d3748;
            font-size: 10px;
            font-weight: 800;
            border-radius: 8px;
            box-shadow: 2px 2px 0 0 #2d3748;
            transition: all 0.2s ease-out;
        }
        
        .copy-mini-btn:active {
            box-shadow: 0 0 0 0 #2d3748;
            transform: translate(2px, 2px);
        }

        .request-url-box {
            margin: 12px 12px 0;
            padding: 10px;
            background: #fff;
            border: 2px solid #2d3748;
            border-radius: 12px;
            box-shadow: 3px 3px 0 0 #2d3748;
        }

        .request-url-box .label {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 5px;
            color: #2d3748;
            font-size: 9px;
            font-weight: 800;
            letter-spacing: .1em;
            text-transform: uppercase;
        }

        .request-url-box code {
            display: block;
            max-height: 48px;
            overflow-y: auto;
            word-break: break-all;
            color: #2d3748;
            font-size: 10px;
            font-weight: 700;
            line-height: 1.45;
        }

        .response-output-box {
            margin: 12px;
            padding: 10px;
            min-height: 58px;
            max-height: 250px;
            overflow-y: auto;
            background: #fdfdfd;
            border: 2px solid #2d3748;
            border-radius: 12px;
            box-shadow: inset 3px 3px 0px 0px rgba(45,55,72,0.05);
        }

        /* EFEK KLIK (RIPPLE) */
        .click-ripple {
            position: fixed;
            width: 30px;
            height: 30px;
            background: rgba(255, 176, 239, 0.7);
            border: 2px solid #2d3748;
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0.5);
            animation: rippleAnim 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            z-index: 99999;
        }

        @keyframes rippleAnim {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(3); opacity: 0; }
        }

        button:active, a:active, .category-header-main:active {
            transform: scale(0.98) translate(2px, 2px);
            transition: transform 0.1s;
        }

        /* FIX BUGS ACCORDION TIDAK BISA DITUTUP */
        .api-section-grid.hidden {
            display: none !important; 
        }

        @media (max-width: 768px) {
            nav .max-w-7xl { height: 56px; padding-left: 12px; padding-right: 12px; }
            #nav-title { font-size: 18px; line-height: 1; }
            #nav-title + span { font-size: 8px; letter-spacing: .11em; }
            nav button { width: 38px !important; height: 38px !important; font-size: 14px; }
            main { display: block !important; padding: 12px 10px 24px !important; overflow: visible; }
            main > aside { position: relative !important; top: auto !important; margin-bottom: 16px; }
            #search-input { height: 46px; font-size: 13px; padding-left: 42px; padding-right: 14px; }
            .search-icon-mobile { left: 14px !important; top: 14px !important; font-size: 15px; }
            #api-container { display: flex; flex-direction: column; gap: 12px; opacity: 1 !important; transform: none !important; }
            .api-section { margin-bottom: 4px; scroll-margin-top: 70px; }
            .api-section-grid { grid-template-columns: 1fr !important; gap: 12px !important; margin-bottom: 12px !important; }
            .category-header-main { display: flex !important; } 
            .api-card-head { padding: 12px !important; min-height: 62px; }
            .method-badge-mobile { width: 48px !important; padding: 6px 4px !important; font-size: 9px !important; }
            .api-card-wrapper code { font-size: 13px !important; line-height: 1.25; }
            .api-name-text { font-size: 10px !important; line-height: 1.25; }
            .params-box-mobile { padding: 12px !important; gap: 10px !important; }
            .api-card-wrapper label { font-size: 9px !important; margin-bottom: 4px; }
            .api-card-wrapper input { padding: 10px !important; font-size: 12px !important; }
            .status-guide-wrap { display: none !important; }
            .action-row-mobile { padding: 12px !important; gap: 10px !important; }
            .response-area { margin: 0 12px 12px !important; max-width: calc(100% - 24px) !important; }
            .response-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px; border-bottom: 2px solid #2d3748; background: #fff; }
            .response-meta { display: inline-flex; align-items: center; gap: 6px; padding: 4px 8px; border: 2px solid #2d3748; background: #fff; border-radius: 8px; box-shadow: 2px 2px 0 0 #2d3748; }
            .response-meta span { font-size: 9px !important; font-weight: 800; color: #2d3748 !important; }
            .response-action-grid { padding: 12px 12px 0 !important; gap: 8px !important; }
            #sidebar-menu { width: 280px; }
            #sidebar-menu .p-5 { padding: 16px; }
            #sidebar-menu h2 { font-size: 18px; }
            #sidebar-menu a { padding: 12px; font-size: 13px; }
            .sidebar-category-btn { padding: 10px 12px !important; font-size: 12px !important; }
            .api-section-grid { align-items: start; }
        }

        .api-card-wrapper { position: relative; overflow: hidden; }
        .api-section { scroll-margin-top: 90px; }
        body.sidebar-open { overflow: hidden; }

        @media (min-width: 1024px) {
            #api-container { gap: 18px; }
            .api-section-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }

        @media (max-width: 768px) {
            main { padding-top: 80px !important; }
            .api-section-grid { gap: 12px !important; }
        }
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', init);

        let globalConfig = null;
        let toastTimeout;
        let activeCategoryId = 'all';

        // --- SISTEM RIPPLE CLICK EVENT ---
        document.addEventListener('mousedown', function(e) {
            const ripple = document.createElement('div');
            ripple.className = 'click-ripple';
            ripple.style.left = e.clientX + 'px';
            ripple.style.top = e.clientY + 'px';
            document.body.appendChild(ripple);
            
            setTimeout(() => {
                ripple.remove();
            }, 500);
        });

        // --- SISTEM STATUS BAR MODERN (WAKTU, BATERAI, RUNTIME) ---
        const pageLoadTime = Date.now();

        function updateLiveClock() {
            const now = new Date();
            const dateOpts = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
            const dateStr = now.toLocaleDateString('id-ID', dateOpts).toUpperCase();
            const timeStr = now.toLocaleTimeString('id-ID');
            
            // Hitung Runtime
            const diffSec = Math.floor((now.getTime() - pageLoadTime) / 1000);
            const h = String(Math.floor(diffSec / 3600)).padStart(2, '0');
            const m = String(Math.floor((diffSec % 3600) / 60)).padStart(2, '0');
            const s = String(diffSec % 60).padStart(2, '0');
            const runtimeStr = `${h}:${m}:${s}`;

            document.querySelectorAll('.live-date-disp').forEach(el => el.innerText = dateStr);
            document.querySelectorAll('.live-time-disp').forEach(el => el.innerText = timeStr);
            document.querySelectorAll('.page-runtime-disp').forEach(el => el.innerText = runtimeStr);
        }
        setInterval(updateLiveClock, 1000);
        updateLiveClock();

        async function initBattery() {
            if (navigator.getBattery) {
                try {
                    const battery = await navigator.getBattery();
                    const updateUI = () => {
                        const level = Math.round(battery.level * 100);
                        const batStr = level + '%' + (battery.charging ? ' ⚡' : '');
                        
                        let batClass = 'battery-icon-disp fa-solid ';
                        if (battery.charging) {
                            batClass += 'fa-bolt text-neo-yellow'; 
                        } else if (level > 75) {
                            batClass += 'fa-battery-full text-neo-green';
                        } else if (level > 40) {
                            batClass += 'fa-battery-half text-neo-yellow';
                        } else {
                            batClass += 'fa-battery-quarter text-neo-red';
                        }

                        document.querySelectorAll('.battery-status-disp').forEach(el => el.innerText = batStr);
                        document.querySelectorAll('.battery-icon-disp').forEach(el => el.className = batClass);
                    };
                    updateUI();
                    battery.addEventListener('levelchange', updateUI);
                    battery.addEventListener('chargingchange', updateUI);
                } catch(e) {}
            }
        }
        initBattery();


        // --- FUNGSI BAWAAN ---
        function openSidebar() {
            document.getElementById('sidebar-overlay')?.classList.remove('hidden');
            document.getElementById('sidebar-menu')?.classList.remove('-translate-x-full');
            document.body.classList.add('sidebar-open');
        }

        function closeSidebar() {
            document.getElementById('sidebar-overlay')?.classList.add('hidden');
            document.getElementById('sidebar-menu')?.classList.add('-translate-x-full');
            document.body.classList.remove('sidebar-open');
        }

        async function init() {
            try {
                // Mock data fallback jika tidak ada /config
                const response = await fetch('/config').catch(()=>({
                    ok: true,
                    json: async () => ({
                        tags: {
                            "Ai Features": [
                                { method: "GET", endpoint: "/api/ai/chat", name: "AI Chat", params: [{name:"text"}] }
                            ],
                            "Downloader": [
                                { method: "GET", endpoint: "/api/dl/tiktok", name: "Tiktok", params: [{name:"url"}] }
                            ]
                        }
                    })
                }));

                if (!response.ok) {
                    throw new Error('Gagal mengambil /config: ' + response.status);
                }

                globalConfig = await response.json();

                setUi(globalConfig);
                loadEnd(globalConfig.tags || {});
                setSearch();
                loadReminder();
                showReadyState();
            } catch (err) {
                showConfigError(err.message || 'Gagal memuat data API.');
            }
        }

        function showReadyState() {
            const container = document.getElementById('api-container');
            if (!container) return;
            container.classList.remove('opacity-0', 'translate-y-4');
            container.classList.add('animate-neoUp');
        }

        function showConfigError(message) {
            const container = document.getElementById('api-container');
            if (!container) return;

            container.classList.remove('opacity-0', 'translate-y-4');
            container.innerHTML = `
                <div class="bg-white border-2 border-[#2d3748] rounded-2xl p-6 shadow-neo text-neo-dark font-bold text-sm leading-relaxed">
                    <div class="flex items-center gap-3 text-neo-red mb-3">
                        <i class="fa-solid fa-triangle-exclamation text-2xl"></i>
                        <span class="text-xl font-black uppercase text-neo-dark">System Error</span>
                    </div>
                    <p class="mb-2 bg-neo-red/20 p-2 rounded-lg border-l-4 border-neo-red">${escapeHtml(message)}</p>

        function escapeHtml(value) {
            return String(value ?? '')
                .split('&').join('&amp;')
                .split('<').join('&lt;')
                .split('>').join('&gt;')
                .split('"').join('&quot;')
                .split("'").join('&#039;');
        }

        function getLastPathName(value) {
            let text = String(value || '').trim();
            text = text.split('?')[0];
            text = text.replace(/^\/+|\/+$/g, '');
            const parts = text.split('/').filter(Boolean);
            let last = parts.length ? parts[parts.length - 1] : text;

            last = last
                .replace(/^api$/i, '')
                .replace(/[-_]+/g, ' ')
                .trim();

            if (!last) return 'feature';
            return last.toLowerCase();
        }

        function getDisplayFeature(value) {
            return getLastPathName(value);
        }

        function getExampleValue(param) {
            const name = typeof param === 'string' ? param : (param?.name || '');
            const type = typeof param === 'string' ? '' : String(param?.type || param?.input || param?.format || '').toLowerCase();
            const key = String(name || '').toLowerCase();
            const combined = key + ' ' + type;

            const isUrl = ['url','link','bg','background','image','img','photo','picture','avatar','thumbnail','thumb','logo','banner','cover','media','file'].some(x => combined.includes(x));

            if (isUrl) return 'https://example.com/image.jpg';
            if (combined.includes('video')) return 'https://example.com/video.mp4';
            if (combined.includes('audio') || combined.includes('sound') || combined.includes('music')) return 'https://example.com/audio.mp3';
            if (combined.includes('email')) return 'user@example.com';
            if (combined.includes('phone') || combined.includes('wa') || combined.includes('whatsapp')) return '6281234567890';
            if (combined.includes('number') || combined.includes('count') || combined.includes('amount') || combined.includes('page')) return '1';
            if (combined.includes('limit')) return '10';
            if (combined.includes('boolean') || combined.includes('bool')) return 'true';
            if (combined.includes('id')) return '1';
            if (combined.includes('apikey') || combined.includes('api_key') || combined.includes('key')) return 'demo-key';

            const isText = ['text','prompt','query','message','caption','title','desc','description','name','username'].some(x => combined.includes(x));
            if (isText || key === 'q') return "Hello KiyomiApi's";

            return 'example';
        }

        function getParamsForCopy(id) {
            const params = {};
            document.querySelectorAll('[id^="input-' + id + '-"]').forEach(input => {
                if (input.value) {
                    params[input.dataset.paramName || input.id.split('input-' + id + '-')[1]] = input.value;
                }
            });
            return params;
        }

        function copySnippet(type, endpoint, method, id) {
            const params = getParamsForCopy(id);
            const fetchUrl = endpoint + (method === 'GET' && Object.keys(params).length ? '?' + new URLSearchParams(params) : '');
            const fullUrl = window.location.origin + fetchUrl;
            
            let code = '';
            if (type === 'url') {
                code = fullUrl;
            } else if (type === 'curl') {
                if (method === 'GET') {
                    code = `curl -X GET "${fullUrl}"`;
                } else {
                    code = `curl -X ${method} "${fullUrl}" -H "Content-Type: application/json" -d '${JSON.stringify(params)}'`;
                }
            } else if (type === 'python') {
                if (method === 'GET') {
                    code = `import requests\n\nres = requests.get("${fullUrl}")\nprint(res.json())`;
                } else {
                    code = `import requests\n\nurl = "${window.location.origin}${endpoint}"\npayload = ${JSON.stringify(params, null, 4)}\nres = requests.${method.toLowerCase()}(url, json=payload)\nprint(res.json())`;
                }
            } else if (type === 'nodejs') {
                if (method === 'GET') {
                    code = `fetch("${fullUrl}")\n  .then(res => res.json())\n  .then(data => console.log(data));`;
                } else {
                    code = `fetch("${window.location.origin}${endpoint}", {\n  method: "${method}",\n  headers: { "Content-Type": "application/json" },\n  body: JSON.stringify(${JSON.stringify(params)})\n})\n.then(res => res.json())\n.then(data => console.log(data));`;
                }
            }
            
            navigator.clipboard.writeText(code);
            messeg(type.toUpperCase() + ' COPIED');
        }

        function copyRes(id) {
            const out = document.getElementById('output-' + id);
            if (out?.innerText) {
                navigator.clipboard.writeText(out.innerText);
                messeg('RESPONSE COPIED');
            }
        }

        function cleanErrorBody(serverMessage) {
            let raw = String(serverMessage || '').trim();
            if (!raw) return '';
            const lower = raw.toLowerCase();

            const isHtmlOrCss = lower.includes('<!doctype html') || lower.includes('<html') || lower.includes('<head') || lower.includes('<body') || lower.includes('<style') || lower.includes('body, html') || lower.includes('background-color') || lower.includes('display: flex') || lower.includes('justify-content') || lower.includes('align-items') || lower.includes('margin: 0') || lower.includes('padding: 0');
            if (isHtmlOrCss) return '';

            try {
                const parsed = JSON.parse(raw);
                if (parsed && typeof parsed === 'object') {
                    return String(parsed.error || parsed.message || parsed.msg || parsed.reason || '').trim().slice(0, 120);
                }
            } catch (e) {}

            raw = raw.split('\n').join(' ').split('\r').join(' ').split('\t').join(' ');
            while (raw.includes('  ')) raw = raw.split('  ').join(' ');
            return raw.trim().slice(0, 120);
        }

        function getErrorMessage(code, statusText, serverMessage) {
            const serverText = cleanErrorBody(serverMessage);
            const messages = {
                400: '400 Bad Request - Input atau parameter salah.',
                401: '401 Unauthorized - API key/token salah atau belum dikirim.',
                403: '403 Forbidden - Akses endpoint ditolak.',
                404: '404 Not Found - Endpoint atau URL salah.',
                408: '408 Timeout - Server terlalu lama merespons.',
                415: '415 Unsupported Media Type - Format request salah.',
                422: '422 Validation Error - Format input tidak sesuai.',
                429: '429 Too Many Requests - Terlalu banyak request.',
                500: '500 Server Error - Server error atau input membuat proses gagal.',
                502: '502 Bad Gateway - Server tujuan bermasalah.',
                503: '503 Service Unavailable - Server sedang mati atau maintenance.',
                504: '504 Gateway Timeout - Server tujuan terlalu lama merespons.',
                505: '505 HTTP Version Not Supported - Versi HTTP tidak didukung.'
            };

            if (serverText) return serverText;
            if (code === 'NETWORK') return 'Network Error - Gagal terhubung ke server.';
            return messages[Number(code)] || (String(code) + ' ' + (statusText || 'Request Failed') + ' - Request gagal diproses.');
        }

        function normalizeApiResponse(data, isSuccess, responseTime) {
            if (data && typeof data === 'object' && !Array.isArray(data)) {
                const cloned = { ...data };
                delete cloned.author; delete cloned.creator; delete cloned.timestamp; delete cloned.response_time;
                return {
                    status: typeof data.status === 'undefined' ? isSuccess : data.status,
                    creator: 'Barikzz',
                    ...cloned,
                    timestamp: new Date().toISOString(),
                    response_time: responseTime + 'ms'
                };
            }
            return {
                status: isSuccess, creator: 'Barikzz', result: data,
                timestamp: new Date().toISOString(), response_time: responseTime + 'ms'
            };
        }

        function renderCleanError(code, statusText, serverMessage, responseTime) {
            return syntaxHighlight({
                status: false,
                creator: 'Barikzz',
                error: getErrorMessage(code, statusText, serverMessage),
                timestamp: new Date().toISOString(),
                response_time: responseTime + 'ms'
            });
        }

        async function testReq(btn, url, method, id) {
            if (btn.disabled) return;

            const out = document.getElementById('output-' + id);
            const status = document.getElementById('status-' + id);
            const time = document.getElementById('time-' + id);
            const resArea = document.getElementById('res-area-' + id);
            const statusIndicator = document.getElementById('status-indicator-' + id);

            if (!out || !status || !time || !resArea || !statusIndicator) return;

            const btnTextEl = btn.querySelector('.btn-text');
            const originalBtnText = btnTextEl.innerText;

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> <span class="btn-text">PROCESSING</span>';

            resArea.classList.remove('hidden', 'success', 'error');
            statusIndicator.className = 'status-indicator status-waiting';
            status.innerText = 'RUNNING...';
            status.className = 'text-[10px] font-mono font-black text-neo-dark tracking-widest';

            out.innerHTML = `
                <div class="flex items-center gap-3 text-neo-dark font-black uppercase bg-neo-bg border-2 border-[#2d3748] rounded-xl p-3 shadow-[2px_2px_0px_0px_rgba(45,55,72,1)] w-fit">
                    <i class="fa-solid fa-circle-notch fa-spin text-lg"></i>
                    <span>Establishing Connection...</span>
                </div>`;

            const params = {};
            document.querySelectorAll('[id^="input-' + id + '-"]').forEach(input => {
                if (input.value) {
                    params[input.dataset.paramName || input.id.split('input-' + id + '-')[1]] = input.value;
                }
            });

            const fetchUrl = url + (method === 'GET' && Object.keys(params).length ? '?' + newSearchParams(params) : '');
            const fullRequestUrl = window.location.origin + fetchUrl;
            const requestLine = document.getElementById('request-line-' + id);

            if (requestLine) {
                requestLine.innerText = method === 'GET'
                    ? 'curl -X GET "' + fullRequestUrl + '"'
                    : 'curl -X ' + method + ' "' + window.location.origin + url + '" -H "Content-Type: application/json" -d \'' + JSON.stringify(params) + '\'';
            }

            const opts = {
                method: method,
                ...(method !== 'GET' ? { headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(params) } : {})
            };

            const start = Date.now();

            try {
                const req = await fetch(fetchUrl, opts);
                const duration = Date.now() - start;

                time.innerText = duration + 'ms';

                if (req.ok) {
                    statusIndicator.className = 'status-indicator status-success';
                    status.innerText = req.status + ' ' + req.statusText;
                    status.className = 'text-[10px] font-mono font-black text-neo-dark bg-neo-green rounded-md px-2 tracking-widest';
                    resArea.classList.add('success');
                } else {
                    statusIndicator.className = 'status-indicator status-error';
                    status.innerText = req.status + ' ' + req.statusText;
                    status.className = 'text-[10px] font-mono font-black text-white bg-neo-red rounded-md px-2 tracking-widest';
                    resArea.classList.add('error');
                }

                const type = req.headers.get('content-type') || '';

                if (!req.ok) {
                    let errorBody = '';
                    try {
                        errorBody = type.includes('json') ? JSON.stringify(await req.json()) : await req.text();
                    } catch (e) {}

                    out.innerHTML = renderCleanError(req.status, req.statusText, errorBody, duration);
                    return;
                }

                if (type.includes('json')) {
                    const json = normalizeApiResponse(await req.json(), true, duration);
                    out.innerHTML = syntaxHighlight(json);
                } else if (type.startsWith('image')) {
                    const blob = await req.blob();
                    const imageUrl = URL.createObjectURL(blob);
                    out.innerHTML = `
                        <div class="flex justify-center p-2 bg-white border-2 border-[#2d3748] rounded-xl shadow-[4px_4px_0px_0px_rgba(45,55,72,1)] w-fit mx-auto mt-2 mb-2">
                            <img src="${imageUrl}" class="max-w-full max-h-[240px] rounded-lg">
                        </div>`;
                } else {
                    const text = await req.text();
                    out.innerHTML = escapeHtml(text);
                }
            } catch (err) {
                const duration = Date.now() - start;
                time.innerText = duration + 'ms';
                statusIndicator.className = 'status-indicator status-error';
                status.innerText = 'ERROR';
                status.className = 'text-[10px] font-mono font-black text-white bg-neo-red rounded-md px-2 tracking-widest';
                resArea.classList.add('error');
                out.innerHTML = renderCleanError('NETWORK', err.message, '', duration);
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-bolt"></i> <span class="btn-text">` + originalBtnText + `</span>`;
            }
        }

        function syntaxHighlight(json) {
            if (typeof json !== 'string') {
                json = JSON.stringify(json, null, 2);
            }
            json = escapeHtml(json);
            return json.replace(
                /(&quot;(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\&])*&quot;(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
                function(match) {
                    let cls = 'json-number';
                    if (match.startsWith('&quot;')) {
                        cls = match.endsWith(':') ? 'json-key' : 'json-string';
                    } else if (match === 'true' || match === 'false') {
                        cls = 'json-boolean';
                    } else if (match === 'null') {
                        cls = 'json-null';
                    }
                    return '<span class="' + cls + '">' + match + '</span>';
                }
            );
        }
    </script>
