<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YuraApi | Documents</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">

    <!-- Konfigurasi Tailwind untuk Neubrutalism -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        mono: ['JetBrains Mono', 'monospace'],
                        sans: ['Outfit', 'sans-serif']
                    },
                    colors: {
                        'brutal-bg': '#f4f0e6',
                        'brutal-red': '#ff5252',
                        'brutal-yellow': '#ffd740',
                        'brutal-green': '#69f0ae',
                        'brutal-blue': '#60a5fa',
                        'brutal-purple': '#e040fb',
                        'brutal-black': '#000000',
                    },
                    boxShadow: {
                        'brutal': '4px 4px 0px rgba(0,0,0,1)',
                        'brutal-lg': '8px 8px 0px rgba(0,0,0,1)',
                        'brutal-sm': '2px 2px 0px rgba(0,0,0,1)',
                    },
                    animation: {
                        blink: 'blink 1s step-end infinite',
                        fadeIn: 'fadeIn .2s ease-out forwards',
                        popIn: 'popIn .2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards'
                    },
                    keyframes: {
                        blink: {
                            '0%, 100%': { opacity: '1' },
                            '50%': { opacity: '0' }
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' }
                        },
                        popIn: {
                            '0%': { opacity: '0', transform: 'scale(0.95) translateY(10px)' },
                            '100%': { opacity: '1', transform: 'scale(1) translateY(0)' }
                        }
                    }
                }
            }
        };
    </script>

    <style>
        /* Global & Background Brutalism */
        html, body {
            width: 100%;
            max-width: 100vw;
            min-height: 100%;
            overflow-x: hidden;
            background-color: #f4f0e6;
            background-image: 
                linear-gradient(#000 1px, transparent 1px),
                linear-gradient(90deg, #000 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center center;
            scrollbar-gutter: stable;
        }

        body { font-size: 14px; }

        /* Scrollbar Retro/Brutalist */
        ::-webkit-scrollbar { width: 12px; height: 12px; }
        ::-webkit-scrollbar-track { background: #fff; border-left: 2px solid #000; }
        ::-webkit-scrollbar-thumb { background: #ffd740; border: 2px solid #000; border-radius: 0; }
        ::-webkit-scrollbar-thumb:hover { background: #ff5252; }
        ::selection { background: #ffd740; color: #000; }

        /* Syntax Highlighting JSON */
        .json-key { color: #d946ef; font-weight: 800; }
        .json-string { color: #0ea5e9; font-weight: 700; }
        .json-number { color: #f97316; font-weight: 800; }
        .json-boolean { color: #10b981; font-weight: 800; }
        .json-null { color: #64748b; font-style: italic; }

        /* Status Indicators */
        .status-indicator {
            width: 12px;
            height: 12px;
            display: inline-block;
            border: 2px solid #000;
        }
        .status-waiting { background: #ffd740; animation: blink 1s infinite; }
        .status-success { background: #69f0ae; }
        .status-error { background: #ff5252; }

        /* Custom Scrollbar for response box */
        .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #000; border: none; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #60a5fa; border: 1px solid #000; }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            main { display: block !important; padding: 70px 12px 22px !important; }
            main > aside { position: relative !important; top: auto !important; margin-bottom: 16px; }
            .api-section-grid { display: grid !important; grid-template-columns: 1fr !important; gap: 16px !important; }
            .api-section { scroll-margin-top: 80px; }
            body.sidebar-open { overflow: hidden; }
        }
    </style>
</head>

<body class="text-brutal-black min-h-screen flex flex-col font-sans">
    
    <!-- Navbar -->
    <nav class="fixed top-0 left-0 right-0 bg-white border-b-[3px] border-black z-[70] w-full">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center gap-4 justify-between">
            <div class="flex items-center gap-3 shrink-0">
                <button onclick="openSidebar()" class="w-10 h-10 bg-brutal-yellow text-black flex items-center justify-center border-2 border-black shadow-brutal-sm hover:translate-x-[2px] hover:translate-y-[2px] hover:shadow-none transition-all cursor-pointer font-bold">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div>
                    <h1 id="nav-title" class="font-black text-2xl tracking-tighter text-black uppercase">YuraApi</h1>
                </div>
            </div>

            <div class="hidden md:flex flex-1 max-w-xl mx-auto h-8 items-center justify-center mx-4">
                <span id="running-text" class="text-black text-xs font-mono font-bold uppercase tracking-widest bg-brutal-green border-2 border-black px-4 py-1 shadow-brutal-sm">
                    API READY
                </span>
            </div>
            <div class="w-10 h-10 hidden md:block"></div>
        </div>
    </nav>

    <!-- Overlay Sidebar -->
    <div id="sidebar-overlay" onclick="closeSidebar()" class="fixed inset-0 bg-black/60 z-[80] hidden animate-fadeIn"></div>

    <!-- Sidebar -->
    <aside id="sidebar-menu" class="fixed top-0 left-0 h-full w-[280px] max-w-[85vw] bg-white z-[90] border-r-[3px] border-black -translate-x-full transition-transform duration-200 ease-out flex flex-col">
        <div class="p-5 border-b-[3px] border-black flex items-center justify-between bg-brutal-purple text-white">
            <div>
                <h2 class="text-2xl font-black text-black">MENU</h2>
            </div>
            <button onclick="closeSidebar()" class="w-9 h-9 bg-white text-black border-2 border-black shadow-brutal-sm hover:translate-x-[2px] hover:translate-y-[2px] hover:shadow-none flex items-center justify-center font-bold transition-all">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div class="p-4 flex-1 overflow-y-auto">
            <a href="/" class="flex items-center gap-3 bg-white border-2 border-black shadow-brutal-sm px-4 py-3 font-black text-black hover:bg-brutal-yellow hover:translate-x-[2px] hover:translate-y-[2px] hover:shadow-none transition-all mb-6 uppercase">
                <i class="fa-solid fa-house"></i>
                <span>Home Page</span>
            </a>

            <div>
                <p class="text-xs text-black font-black uppercase tracking-widest px-2 mb-3 bg-brutal-blue inline-block border-2 border-black p-1 shadow-brutal-sm">Categories</p>
                <div id="sidebar-categories" class="space-y-3"></div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto w-full px-4 py-6 mt-16 grid lg:grid-cols-12 gap-8 items-start relative z-10 overflow-hidden">
        
        <!-- Search & Filter Area -->
        <aside class="lg:col-span-3 lg:sticky lg:top-24 flex flex-col gap-6 h-fit z-40 w-full">
            <div class="relative group">
                <input type="text" id="search-input" placeholder="Search Endpoint..." class="w-full h-12 bg-white border-[3px] border-black px-4 pl-12 font-bold text-sm text-black shadow-brutal focus:outline-none focus:translate-x-[2px] focus:translate-y-[2px] focus:shadow-brutal-sm transition-all placeholder:text-slate-500 uppercase">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-[14px] text-black text-lg"></i>
            </div>
        </aside>

        <!-- API Container -->
        <section class="lg:col-span-9 min-h-[50vh] w-full">
            <div id="api-container" class="space-y-8 w-full"></div>

            <div id="no-results" class="hidden flex-col items-center justify-center py-20 text-center bg-white border-[3px] border-black shadow-brutal mt-4">
                <i class="fa-solid fa-ghost text-5xl mb-4 text-black"></i>
                <p class="font-black text-xl text-black uppercase">Endpoint Not Found</p>
            </div>
        </section>
    </main>

    <!-- Toast -->
    <div id="custom-toast" class="fixed bottom-6 right-6 z-[100] transform translate-y-32 opacity-0 transition-all duration-300">
        <div class="bg-brutal-green text-black px-5 py-3 font-black text-sm shadow-brutal flex items-center gap-3 border-[3px] border-black uppercase tracking-widest">
            <i class="fa-solid fa-check border-2 border-black p-1 bg-white rounded-full"></i>
            <span id="toast-message">SUCCESS</span>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', init);

        let globalConfig = null;
        let toastTimeout;
        let activeCategoryId = 'all';

        function openSidebar() {
            document.getElementById('sidebar-overlay')?.classList.remove('hidden');
            document.getElementById('sidebar-menu')?.classList.remove('-translate-x-full');
            document.body.classList.add('sidebar-open');
        }

        function closeSidebar() {
            document.getElementById('sidebar-overlay')?.classList.add('hidden');
            document.getElementById('sidebar-menu')?.classList.add('-translate-x-full');
            document.body.classList.remove('sidebar-open');
        }

        async function init() {
            try {
                // Konsep: Fetch config akan mengambil data folder otomatis dari backend
                const response = await fetch('/config');
                if (!response.ok) throw new Error('Gagal mengambil /config: ' + response.status);
                
                globalConfig = await response.json();

                setUi(globalConfig);
                loadEnd(globalConfig.tags || {});
                setSearch();
                loadReminder();
            } catch (err) {
                showConfigError(err.message || 'Gagal memuat data API.');
            }
        }

        function showConfigError(message) {
            const container = document.getElementById('api-container');
            if (!container) return;
            container.innerHTML = `
                <div class="bg-brutal-red border-[3px] border-black p-6 shadow-brutal text-black font-black text-sm uppercase">
                    <i class="fa-solid fa-triangle-exclamation mr-2 text-xl"></i> ERROR: ${escapeHtml(message)}
                    <p class="mt-2 font-bold text-xs bg-white border-2 border-black p-2 inline-block">Pastikan route /config mengembalikan object 'tags' dari folder router.</p>
                </div>`;
        }

        async function loadReminder() {
            try {
                const req = await fetch('../src/reminder.json');
                const data = await req.json();
                if (data?.message) {
                    const runningText = document.getElementById('running-text');
                    if (runningText) runningText.innerText = 'SYSTEM ONLINE';
                }
            } catch (e) {}
        }

        function setUi(config) {
            const s = config.settings || {};
            const navTitle = document.getElementById('nav-title');
            if (navTitle) navTitle.innerText = 'YuraApi';

            if (s.favicon) {
                let link = document.querySelector("link[rel~='icon']") || document.createElement('link');
                link.rel = 'icon';
                link.href = s.favicon;
                document.head.appendChild(link);
            }
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .split('&').join('&amp;')
                .split('<').join('&lt;')
                .split('>').join('&gt;')
                .split('"').join('&quot;')
                .split("'").join('&#039;');
        }

        function getLastPathName(value) {
            let text = String(value || '').trim().split('?')[0].replace(/^\/+|\/+$/g, '');
            const parts = text.split('/').filter(Boolean);
            let last = parts.length ? parts[parts.length - 1] : text;
            last = last.replace(/^api$/i, '').replace(/[-_]+/g, ' ').trim();
            return !last ? 'feature' : last.toLowerCase();
        }

        function getExampleValue(param) {
            const name = typeof param === 'string' ? param : (param?.name || '');
            const type = typeof param === 'string' ? '' : String(param?.type || param?.input || param?.format || '').toLowerCase();
            const combined = String(name || '').toLowerCase() + ' ' + type;

            if (['url','link','image','img','video','audio'].some(x => combined.includes(x))) return 'https://example.com/file.jpg';
            if (['number','limit','page','count'].some(x => combined.includes(x))) return '1';
            if (['boolean','bool'].some(x => combined.includes(x))) return 'true';
            if (['apikey','key'].some(x => combined.includes(x))) return 'demo-key';
            return 'YuraApi';
        }

        function loadEnd(tags) {
            const container = document.getElementById('api-container');
            const sidebarCategories = document.getElementById('sidebar-categories');
            if (!container) return;
            container.innerHTML = '';

            const entries = Object.entries(tags || {}).sort((a, b) => a[0].localeCompare(b[0]));

            if (!entries.length) {
                showConfigError("Data endpoint kosong.");
                return;
            }

            // --- Render Sidebar Categories (Brutalist style) ---
            if (sidebarCategories) {
                const allBtn = `
                    <button onclick="showAllCategories(this)" class="sidebar-category-btn active w-full flex items-center gap-3 bg-brutal-yellow border-2 border-black shadow-brutal-sm px-3 py-2 text-xs font-black text-black hover:-translate-y-1 hover:shadow-brutal transition-all uppercase">
                        <i class="fa-solid fa-border-all"></i> <span class="truncate">All Endpoint</span>
                    </button>`;

                const categoryBtns = entries.map((item, idx) => {
                    const sectionId = 'section-cat-' + idx;
                    return `
                        <button onclick="filterCategory('${sectionId}', this)" class="sidebar-category-btn w-full flex items-center gap-3 bg-white border-2 border-black shadow-brutal-sm px-3 py-2 text-xs font-black text-black hover:-translate-y-1 hover:shadow-brutal hover:bg-brutal-blue transition-all uppercase">
                            <i class="fa-solid fa-folder-closed"></i> <span class="truncate">${escapeHtml(item[0])}</span>
                        </button>`;
                }).join('');
                sidebarCategories.innerHTML = allBtn + categoryBtns;
            }

            // --- Render Sections and Cards ---
            entries.forEach(([cat, routes], catIndex) => {
                const section = document.createElement('div');
                section.id = 'section-cat-' + catIndex;
                section.className = 'api-section w-full mb-8 animate-popIn';
                section.dataset.category = cat;

                // Header Kategori
                section.innerHTML = `
                    <div class="w-full bg-brutal-blue border-[3px] border-black shadow-brutal p-4 mb-4 flex items-center gap-3">
                        <div class="w-10 h-10 bg-white border-2 border-black flex items-center justify-center text-xl shadow-brutal-sm">
                            <i class="fa-solid fa-folder-open"></i>
                        </div>
                        <div>
                            <h2 class="text-xl font-black text-black uppercase tracking-tight">${escapeHtml(cat)}</h2>
                            <p class="text-[11px] bg-white border border-black inline-block px-2 font-bold">${Array.isArray(routes) ? routes.length : 0} ROUTES</p>
                        </div>
                    </div>
                    <div class="api-section-grid grid grid-cols-1 md:grid-cols-2 gap-6 w-full"></div>`;

                const grid = section.querySelector('.api-section-grid');
                const list = Array.isArray(routes) ? routes : [];

                list.forEach((route, idx) => {
                    const id = catIndex + '-' + idx;
                    const method = String(route.method || 'GET').toUpperCase();
                    const endpoint = String(route.endpoint || '/');
                    const featureName = getDisplayFeature(route.name || endpoint);
                    
                    let methodColor = method === 'GET' ? 'bg-brutal-green' : method === 'POST' ? 'bg-brutal-yellow' : 'bg-brutal-red';
                    
                    let copyUrl = endpoint;
                    if (method === 'GET' && Array.isArray(route.params) && route.params.length > 0) {
                        copyUrl = endpoint + '?' + route.params.map(p => encodeURIComponent(p.name) + '=').join('&');
                    }

                    // Input Parameters
                    let inputs = '';
                    if (Array.isArray(route.params) && route.params.length) {
                        inputs = '<div class="p-4 bg-brutal-bg border-y-[3px] border-black grid gap-3 w-full">' +
                            route.params.map(p => {
                                const inputId = ('input-' + id + '-' + p.name).replace(/\s+/g, '-');
                                const value = p.example || p.default || getExampleValue(p);
                                return `
                                    <div>
                                        <label class="text-[10px] font-black text-black uppercase bg-white border-2 border-black px-2 py-0.5 inline-block mb-1 shadow-brutal-sm">
                                            ${escapeHtml(p.name)} ${p.required ? '<span class="text-brutal-red">*</span>' : ''}
                                        </label>
                                        <input type="text" id="${escapeHtml(inputId)}" data-param-name="${escapeHtml(p.name)}" value="${escapeHtml(value)}" class="w-full border-[3px] border-black p-2 font-mono text-sm bg-white shadow-brutal-sm focus:shadow-none focus:translate-x-[2px] focus:translate-y-[2px] focus:outline-none transition-all">
                                    </div>`;
                            }).join('') + '</div>';
                    }

                    // Card API
                    const card = document.createElement('div');
                    card.className = 'api-card-wrapper bg-white border-[3px] border-black shadow-brutal hover:-translate-y-1 hover:shadow-brutal-lg transition-all duration-200 overflow-hidden';
                    card.dataset.search = (featureName + ' ' + endpoint + ' ' + cat).toLowerCase();

                    card.innerHTML = `
                        <!-- Card Header -->
                        <div class="p-3 cursor-pointer select-none hover:bg-brutal-bg transition-colors flex justify-between items-center gap-2 border-black" onclick="toggleCard('${id}')">
                            <div class="flex items-center gap-3 overflow-hidden min-w-0">
                                <span class="px-2 py-1 text-[11px] font-black text-black ${methodColor} border-2 border-black shadow-brutal-sm w-14 text-center shrink-0">${escapeHtml(method)}</span>
                                <div class="flex flex-col min-w-0">
                                    <code class="font-black text-sm truncate text-black">${escapeHtml(featureName).toUpperCase()}</code>
                                    <span class="text-[10px] text-slate-600 font-bold truncate">${escapeHtml(endpoint)}</span>
                                </div>
                            </div>
                            <i id="icon-${id}" class="fa-solid fa-plus text-black font-black text-lg transition-transform duration-200"></i>
                        </div>

                        <!-- Card Body (Hidden default) -->
                        <div id="body-${id}" class="hidden w-full border-t-[3px] border-black">
                            ${inputs}

                            <div class="p-4 flex gap-3 bg-white w-full items-center">
                                <button onclick="testReq(this, '${escapeHtml(endpoint)}', '${escapeHtml(method)}', '${id}')" class="flex-1 bg-brutal-purple text-white border-[3px] border-black py-2 font-black uppercase tracking-wider shadow-brutal hover:translate-x-[2px] hover:translate-y-[2px] hover:shadow-none transition-all">
                                    <span class="btn-inner"><i class="fa-solid fa-bolt"></i> Execute</span>
                                </button>
                                <button onclick="copyFullUrl('${escapeHtml(copyUrl)}')" class="w-12 h-11 bg-white border-[3px] border-black flex items-center justify-center text-lg shadow-brutal hover:translate-x-[2px] hover:translate-y-[2px] hover:shadow-none hover:bg-brutal-yellow transition-all" title="Copy Full URL">
                                    <i class="fa-regular fa-copy"></i>
                                </button>
                            </div>

                            <!-- Response Box -->
                            <div id="res-area-${id}" class="hidden m-4 border-[3px] border-black shadow-brutal bg-black overflow-hidden">
                                <div class="bg-white border-b-[3px] border-black p-2 flex justify-between items-center">
                                    <div class="flex items-center gap-2">
                                        <span id="status-indicator-${id}" class="status-indicator status-waiting"></span>
                                        <span id="status-${id}" class="text-[10px] font-black font-mono">IDLE</span>
                                    </div>
                                    <span id="time-${id}" class="text-[10px] font-black font-mono bg-brutal-yellow border border-black px-2">0ms</span>
                                </div>

                                <div class="bg-white border-b-[3px] border-black p-2 flex flex-wrap gap-2">
                                    <button onclick="copyEndpoint('${escapeHtml(endpoint)}')" class="bg-white border-2 border-black text-[9px] font-black px-2 py-1 shadow-brutal-sm hover:translate-x-[1px] hover:translate-y-[1px] hover:shadow-none uppercase">Endpoint</button>
                                    <button onclick="copyRequest('${escapeHtml(endpoint)}', '${escapeHtml(method)}', '${id}')" class="bg-white border-2 border-black text-[9px] font-black px-2 py-1 shadow-brutal-sm hover:translate-x-[1px] hover:translate-y-[1px] hover:shadow-none uppercase">Request</button>
                                    <button onclick="copyRes('${id}')" class="bg-white border-2 border-black text-[9px] font-black px-2 py-1 shadow-brutal-sm hover:translate-x-[1px] hover:translate-y-[1px] hover:shadow-none uppercase bg-brutal-green">Copy Result</button>
                                </div>
                                
                                <div class="bg-black p-2 border-b-[3px] border-black">
                                    <code id="request-line-${id}" class="text-brutal-green text-[10px] font-mono break-all">curl -X ${escapeHtml(method)} ${escapeHtml(endpoint)}</code>
                                </div>

                                <div class="p-3 max-h-48 overflow-y-auto custom-scrollbar bg-[#0f172a]">
                                    <div id="output-${id}" class="font-mono text-[11px] text-white break-all whitespace-pre-wrap leading-relaxed"></div>
                                </div>
                            </div>
                        </div>`;

                    grid.appendChild(card);
                });
                container.appendChild(section);
            });
        }

        // --- Fungsi Logika UI lainnya (Tidak diubah dari aslinya, hanya penyesuaian styling DOM) ---
        function setActiveSidebarCategory(btn) {
            document.querySelectorAll('.sidebar-category-btn').forEach(el => {
                el.classList.remove('bg-brutal-yellow', 'bg-brutal-blue');
                el.classList.add('bg-white');
            });
            if (btn) {
                btn.classList.remove('bg-white');
                btn.classList.add('bg-brutal-yellow');
            }
        }

        function showAllCategories(btn) {
            activeCategoryId = 'all';
            setActiveSidebarCategory(btn);
            document.querySelectorAll('.api-section').forEach(section => section.classList.remove('hidden'));
            document.getElementById('search-input').value = '';
            document.getElementById('no-results').classList.add('hidden');
            document.getElementById('no-results').classList.remove('flex');
            closeSidebar();
        }

        function filterCategory(sectionId, btn) {
            activeCategoryId = sectionId;
            setActiveSidebarCategory(btn);
            document.querySelectorAll('.api-section').forEach(section => {
                section.classList.toggle('hidden', section.id !== sectionId);
            });
            document.getElementById('search-input').value = '';
            document.getElementById('no-results').classList.add('hidden');
            document.getElementById('no-results').classList.remove('flex');
            closeSidebar();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleCard(id) {
            const body = document.getElementById('body-' + id);
            const icon = document.getElementById('icon-' + id);
            if (!body || !icon) return;

            const isHidden = body.classList.contains('hidden');
            body.classList.toggle('hidden', !isHidden);
            icon.classList.toggle('fa-plus', !isHidden);
            icon.classList.toggle('fa-minus', isHidden);
            icon.classList.toggle('rotate-180', isHidden);
        }

        function setSearch() {
            const input = document.getElementById('search-input');
            if (!input) return;
            input.addEventListener('input', e => {
                const val = e.target.value.toLowerCase().trim();
                let anyVisible = false;
                document.querySelectorAll('.api-section').forEach(section => {
                    const allowed = activeCategoryId === 'all' || section.id === activeCategoryId;
                    let matchCount = 0;
                    section.querySelectorAll('.api-card-wrapper').forEach(card => {
                        const match = !val || card.dataset.search.includes(val);
                        card.classList.toggle('hidden', !match);
                        if (match) matchCount++;
                    });
                    const secVis = allowed && matchCount > 0;
                    section.classList.toggle('hidden', !secVis);
                    if (secVis) anyVisible = true;
                });
                
                const noRes = document.getElementById('no-results');
                if (anyVisible) {
                    noRes.classList.add('hidden'); noRes.classList.remove('flex');
                } else {
                    noRes.classList.remove('hidden'); noRes.classList.add('flex');
                }
            });
        }

        function messeg(msg) {
            const toast = document.getElementById('custom-toast');
            const msgBox = document.getElementById('toast-message');
            msgBox.innerText = msg;
            toast.classList.remove('translate-y-32', 'opacity-0');
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.add('translate-y-32', 'opacity-0');
            }, 2500);
        }

        function copyFullUrl(path) { navigator.clipboard.writeText(window.location.origin + path); messeg('URL COPIED'); }
        function copyEndpoint(endpoint) { navigator.clipboard.writeText(endpoint); messeg('ENDPOINT COPIED'); }
        function copyRequest(endpoint, method, id) {
            const line = document.getElementById('request-line-' + id);
            navigator.clipboard.writeText(line?.innerText || ('curl -X ' + method + ' ' + window.location.origin + endpoint));
            messeg('REQUEST COPIED');
        }
        function copyRes(id) {
            const out = document.getElementById('output-' + id);
            if (out?.innerText) { navigator.clipboard.writeText(out.innerText); messeg('RESPONSE COPIED'); }
        }

        function cleanErrorBody(raw) {
            if (!raw) return '';
            const lower = String(raw).toLowerCase();
            if (lower.includes('<html') || lower.includes('<body')) return '';
            try {
                const p = JSON.parse(raw);
                if (p && typeof p === 'object') return String(p.error || p.message || p.msg || '').trim().slice(0, 120);
            } catch (e) {}
            return String(raw).replace(/\s+/g, ' ').trim().slice(0, 120);
        }

        async function testReq(btn, url, method, id) {
            if (btn.disabled) return;
            const out = document.getElementById('output-' + id);
            const status = document.getElementById('status-' + id);
            const time = document.getElementById('time-' + id);
            const resArea = document.getElementById('res-area-' + id);
            const statusIndicator = document.getElementById('status-indicator-' + id);
            
            const btnInner = btn.querySelector('.btn-inner');
            const originalText = btnInner.innerHTML;

            btn.disabled = true;
            btnInner.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> WAIT';
            btn.classList.replace('bg-brutal-purple', 'bg-slate-300');

            resArea.classList.remove('hidden');
            statusIndicator.className = 'status-indicator status-waiting';
            status.innerText = 'FETCHING...';
            out.innerHTML = '<span class="text-brutal-yellow">Loading data...</span>';

            const params = {};
            document.querySelectorAll('[id^="input-' + id + '-"]').forEach(inp => {
                if (inp.value) params[inp.dataset.paramName] = inp.value;
            });

            const fetchUrl = url + (method === 'GET' && Object.keys(params).length ? '?' + new URLSearchParams(params) : '');
            const fullReq = window.location.origin + fetchUrl;
            
            const reqLine = document.getElementById('request-line-' + id);
            if (reqLine) {
                reqLine.innerText = method === 'GET' ? `curl -X GET "${fullReq}"` : `curl -X ${method} "${window.location.origin}${url}" -H "Content-Type: application/json" -d '${JSON.stringify(params)}'`;
            }

            const start = Date.now();
            try {
                const req = await fetch(fetchUrl, {
                    method,
                    ...(method !== 'GET' ? { headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(params) } : {})
                });
                
                const duration = Date.now() - start;
                time.innerText = duration + 'ms';

                if (req.ok) {
                    statusIndicator.className = 'status-indicator status-success';
                    status.innerText = `${req.status} OK`;
                } else {
                    statusIndicator.className = 'status-indicator status-error';
                    status.innerText = `${req.status} ERR`;
                }

                const type = req.headers.get('content-type') || '';
                if (!req.ok) {
                    let errBody = '';
                    try { errBody = type.includes('json') ? JSON.stringify(await req.json()) : await req.text(); } catch(e){}
                    out.innerHTML = `<span class="text-brutal-red">${cleanErrorBody(errBody) || 'Request Failed'}</span>`;
                    return;
                }

                if (type.includes('json')) {
                    const json = await req.json();
                    out.innerHTML = syntaxHighlight(json);
                } else if (type.startsWith('image')) {
                    const blob = await req.blob();
                    out.innerHTML = `<img src="${URL.createObjectURL(blob)}" class="max-w-full border-2 border-white max-h-[240px]">`;
                } else {
                    out.innerHTML = escapeHtml(await req.text());
                }
            } catch (err) {
                time.innerText = (Date.now() - start) + 'ms';
                statusIndicator.className = 'status-indicator status-error';
                status.innerText = 'NETWORK ERR';
                out.innerHTML = `<span class="text-brutal-red">Network Error: ${err.message}</span>`;
            } finally {
                btn.disabled = false;
                btnInner.innerHTML = originalText;
                btn.classList.replace('bg-slate-300', 'bg-brutal-purple');
            }
        }

        function syntaxHighlight(json) {
            if (typeof json !== 'string') json = JSON.stringify(json, null, 2);
            json = escapeHtml(json);
            return json.replace(/(&quot;(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\&])*&quot;(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function(m) {
                let cls = 'json-number';
                if (m.startsWith('&quot;')) cls = m.endsWith(':') ? 'json-key' : 'json-string';
                else if (m==='true'||m==='false') cls = 'json-boolean';
                else if (m==='null') cls = 'json-null';
                return `<span class="${cls}">${m}</span>`;
            });
        }
    </script>
</body>
</html>
