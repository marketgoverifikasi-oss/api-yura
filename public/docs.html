<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YuraApi | Documents</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Quicksand:wght@500;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        mono: ['JetBrains Mono', 'monospace'],
                        sans: ['Quicksand', 'sans-serif']
                    },
                    colors: {
                        'neo-bg': '#f4f0ea',
                        'neo-yellow': '#ffde59',
                        'neo-blue': '#a6faff',
                        'neo-pink': '#ff90e8',
                        'neo-red': '#ff5757',
                        'neo-green': '#00e676'
                    },
                    boxShadow: {
                        'neo': '4px 4px 0px 0px rgba(0,0,0,1)',
                        'neo-sm': '2px 2px 0px 0px rgba(0,0,0,1)',
                        'neo-lg': '8px 8px 0px 0px rgba(0,0,0,1)',
                        'neo-active': '0px 0px 0px 0px rgba(0,0,0,1)'
                    },
                    animation: {
                        blink: 'blink 1s step-end infinite',
                        fadeIn: 'fadeIn .25s ease-out forwards',
                        neoUp: 'neoUp .2s ease-out forwards'
                    },
                    keyframes: {
                        blink: {
                            '0%, 100%': { opacity: '1' },
                            '50%': { opacity: '0' }
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' }
                        },
                        neoUp: {
                            '0%': {
                                opacity: '0',
                                transform: 'translateY(10px) translateX(10px)'
                            },
                            '100%': {
                                opacity: '1',
                                transform: 'translateY(0) translateX(0)'
                            }
                        }
                    }
                }
            }
        };
    </script>

    <style>
        html, body {
            width: 100%;
            max-width: 100vw;
            min-height: 100%;
            overflow-x: hidden;
            background: #f4f0ea;
        }

        body {
            font-size: 13px;
        }

        /* Fixed Background pattern typical for neubrutalism */
        #fixed-bg {
            position: fixed;
            inset: 0;
            z-index: -50;
            background: #f4f0ea;
            background-image: radial-gradient(#000 1px, transparent 1px);
            background-size: 24px 24px;
            opacity: 0.15;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f4f0ea;
            border-left: 2px solid black;
        }

        ::-webkit-scrollbar-thumb {
            background: #ffde59;
            border: 2px solid black;
        }

        .json-key { color: #000; font-weight: 800; }
        .json-string { color: #047857; font-weight: 700; }
        .json-number { color: #d946ef; font-weight: 800; }
        .json-boolean { color: #2563eb; font-weight: 800; }
        .json-null { color: #64748B; font-weight: 800; }

        .status-indicator {
            width: 12px;
            height: 12px;
            display: inline-block;
            border: 2px solid black;
        }

        .status-waiting { background: #a6faff; animation: blink 1.5s infinite; }
        .status-success { background: #00e676; }
        .status-error { background: #ff5757; }

        .sidebar-category-btn.active {
            background: #ffde59 !important;
            box-shadow: 2px 2px 0px 0px rgba(0,0,0,1) !important;
            transform: translate(2px, 2px);
        }

        .copy-mini-btn {
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 0 10px;
            border: 2px solid black;
            background: #fff;
            color: black;
            font-size: 10px;
            font-weight: 800;
            box-shadow: 2px 2px 0 0 black;
            transition: all 0.1s;
        }
        
        .copy-mini-btn:active {
            box-shadow: 0 0 0 0 black;
            transform: translate(2px, 2px);
        }

        .request-url-box {
            margin: 12px 12px 0;

            #api-container {
                gap: 18px;

                grid-template-columns: repeat(2, minmax(0, 1fr));

<body class="text-black min-h-screen flex flex-col font-sans selection:bg-neo-yellow selection:text-black">
    <div id="fixed-bg"></div>

    <nav class="fixed top-0 left-0 right-0 border-b-4 border-black bg-white z-[70] w-full">

        <div class="flex items-center gap-4 shrink-0">
            <button onclick="openSidebar()" class="w-10 h-10 bg-neo-pink text-black border-2 border-black flex items-center justify-center shadow-neo hover:shadow-neo-sm hover:translate-x-[2px] hover:translate-y-[2px] active:shadow-neo-active transition-all cursor-pointer">
                <i class="fa-solid fa-bars font-black text-lg"></i>
            </button>

            <div>
                <h1 id="nav-title" class="font-black text-2xl tracking-tight text-black uppercase">YuraApi</h1>

    <div id="custom-toast" class="fixed bottom-8 right-8 z-[100] transform translate-y-32 opacity-0 transition-all duration-300">

            <div class="w-8 h-8 bg-neo-green border-2 border-black text-black flex items-center justify-center shadow-neo-sm">
                <i class="fa-solid fa-check"></i>
            </div>
            <span id="toast-message" class="tracking-wider">SUCCESS</span>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', init);

        let globalConfig = null;
        let toastTimeout;
        let activeCategoryId = 'all';

        function openSidebar() {
            document.getElementById('sidebar-overlay')?.classList.remove('hidden');
            document.getElementById('sidebar-menu')?.classList.remove('-translate-x-full');
            document.body.classList.add('sidebar-open');
        }

        function closeSidebar() {
            document.getElementById('sidebar-overlay')?.classList.add('hidden');
            document.getElementById('sidebar-menu')?.classList.add('-translate-x-full');
            document.body.classList.remove('sidebar-open');
        }

        async function init() {
            try {
                const response = await fetch('/config');

                if (!response.ok) {
                    throw new Error('Gagal mengambil /config: ' + response.status);
                }

                globalConfig = await response.json();

                setUi(globalConfig);
                loadEnd(globalConfig.tags || {});
                setSearch();
                loadReminder();
                showReadyState();
            } catch (err) {
                showConfigError(err.message || 'Gagal memuat data API.');
            }
        }

        function showReadyState() {
            const container = document.getElementById('api-container');
            if (!container) return;
            container.classList.remove('opacity-0', 'translate-y-4');
            container.classList.add('animate-neoUp');
        }

        function showConfigError(message) {
            const container = document.getElementById('api-container');
            if (!container) return;

            container.classList.remove('opacity-0', 'translate-y-4');
            container.innerHTML = `
                <div class="bg-white border-4 border-black p-6 shadow-neo text-black font-bold text-sm leading-relaxed">
                    <div class="flex items-center gap-3 text-neo-red mb-3">
                        <i class="fa-solid fa-triangle-exclamation text-2xl"></i>
                        <span class="text-xl font-black uppercase text-black">System Error</span>
                    </div>
                    <p class="mb-2 bg-neo-red/20 p-2 border-l-4 border-neo-red">${escapeHtml(message)}</p>
                    <p class="font-black">Cek route <code class="bg-black text-white px-1">/config</code> dan pastikan data <code class="bg-black text-white px-1">tags</code> tidak kosong.</p>
                </div>`;
        }

        async function loadReminder() {
            try {
                const req = await fetch('../src/reminder.json');
                const data = await req.json();

                if (data?.message) {
                    const runningText = document.getElementById('running-text');
                    if (runningText) runningText.innerText = 'READY TO USE';
                }
            } catch (e) {}
        }

        function setUi(config) {
            const s = config.settings || {};
            const navTitle = document.getElementById('nav-title');

            if (navTitle) {
                navTitle.innerText = 'YuraApi';
            }

            if (s.favicon) {
                let link = document.querySelector("link[rel~='icon']") || document.createElement('link');
                link.rel = 'icon';
                link.href = s.favicon;
                document.head.appendChild(link);
            }
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .split('&').join('&amp;')
                .split('<').join('&lt;')
                .split('>').join('&gt;')
                .split('"').join('&quot;')
                .split("'").join('&#039;');
        }

        function getLastPathName(value) {
            let text = String(value || '').trim();
            text = text.split('?')[0];
            text = text.replace(/^\/+|\/+$/g, '');
            const parts = text.split('/').filter(Boolean);
            let last = parts.length ? parts[parts.length - 1] : text;

            last = last
                .replace(/^api$/i, '')
                .replace(/[-_]+/g, ' ')
                .trim();

            if (!last) return 'feature';
            return last.toLowerCase();
        }

        function getDisplayFeature(value) {
            return getLastPathName(value);
        }

        function getExampleValue(param) {
            const name = typeof param === 'string' ? param : (param?.name || '');
            const type = typeof param === 'string' ? '' : String(param?.type || param?.input || param?.format || '').toLowerCase();
            const key = String(name || '').toLowerCase();
            const combined = key + ' ' + type;

            const isUrl = ['url','link','bg','background','image','img','photo','picture','avatar','thumbnail','thumb','logo','banner','cover','media','file'].some(x => combined.includes(x));

            if (isUrl) return 'https://example.com/image.jpg';
            if (combined.includes('video')) return 'https://example.com/video.mp4';
            if (combined.includes('audio') || combined.includes('sound') || combined.includes('music')) return 'https://example.com/audio.mp3';
            if (combined.includes('email')) return 'user@example.com';
            if (combined.includes('phone') || combined.includes('wa') || combined.includes('whatsapp')) return '6281234567890';
            if (combined.includes('number') || combined.includes('count') || combined.includes('amount') || combined.includes('page')) return '1';
            if (combined.includes('limit')) return '10';
            if (combined.includes('boolean') || combined.includes('bool')) return 'true';
            if (combined.includes('id')) return '1';
            if (combined.includes('apikey') || combined.includes('api_key') || combined.includes('key')) return 'demo-key';

            const isText = ['text','prompt','query','message','caption','title','desc','description','name','username'].some(x => combined.includes(x));
            if (isText || key === 'q') return 'Hello YuraApi';

            return 'example';
        }

        function loadEnd(tags) {
            const container = document.getElementById('api-container');
            const sidebarCategories = document.getElementById('sidebar-categories');

            if (!container) return;
            container.innerHTML = '';

            const entries = Object.entries(tags || {}).sort((a, b) => a[0].localeCompare(b[0]));

            if (!entries.length) {
                container.innerHTML = `
                    <div class="bg-white border-4 border-black p-6 shadow-neo text-black font-bold">
                        <div class="flex items-center gap-3 bg-neo-yellow border-2 border-black p-3 mb-2 shadow-neo-sm">
                            <i class="fa-solid fa-circle-info text-xl"></i>
                            <span class="text-sm">Data endpoint kosong. Pastikan <code class="bg-white px-1 border border-black">/config</code> punya object <code class="bg-white px-1 border border-black">tags</code>.</span>
                        </div>
                    </div>`;
                return;
            }

            if (sidebarCategories) {
                const allBtn = `
                    <button onclick="showAllCategories(this)" class="sidebar-category-btn active w-full flex items-center gap-3 bg-white border-2 border-black shadow-neo px-4 py-3 text-sm font-black text-black hover:bg-neo-yellow hover:translate-x-[2px] hover:translate-y-[2px] hover:shadow-neo-sm transition-all mb-3">
                        <i class="fa-solid fa-border-all text-[14px]"></i>
                        <span class="truncate">Semua</span>
                    </button>`;

                const categoryBtns = entries.map((item, idx) => {
                    const safeName = escapeHtml(item[0]);
                    const sectionId = 'section-cat-' + idx;

                    return `
                        <button onclick="filterCategory('${sectionId}', this)" class="sidebar-category-btn w-full flex items-center gap-3 bg-white border-2 border-black shadow-neo px-4 py-3 text-sm font-black text-black hover:bg-neo-yellow hover:translate-x-[2px] hover:translate-y-[2px] hover:shadow-neo-sm transition-all mb-3">
                            <i class="fa-solid fa-layer-group text-[14px]"></i>
                            <span class="truncate">${safeName}</span>
                        </button>`;
                }).join('');

                sidebarCategories.innerHTML = allBtn + categoryBtns;
            }

            entries.forEach(([cat, routes], catIndex) => {
                const section = document.createElement('div');
                section.id = 'section-cat-' + catIndex;
                section.className = 'api-section w-full animate-neoUp';
                section.dataset.category = cat;

                section.innerHTML = `
                    <div class="category-header-main w-full bg-neo-blue border-4 border-black shadow-neo p-4 mb-5">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 bg-white border-2 border-black flex items-center justify-center text-xl shadow-neo-sm shrink-0">
                                <i class="fa-solid fa-folder-open"></i>
                            </div>
                            <div class="min-w-0">
                                <h2 class="text-lg font-black tracking-wide text-black uppercase truncate">${escapeHtml(cat)}</h2>
                                <p class="text-[11px] text-black bg-white border-2 border-black px-2 py-0.5 mt-1 inline-block font-bold tracking-widest shadow-neo-sm">${Array.isArray(routes) ? routes.length : 0} FEATURES</p>
                            </div>
                        </div>
                    </div>
                    <div class="api-section-grid grid grid-cols-1 md:grid-cols-2 gap-4 mb-6 w-full"></div>`;

                const grid = section.querySelector('.api-section-grid');
                const list = Array.isArray(routes) ? routes : [];

                list.forEach((route, idx) => {
                    const id = catIndex + '-' + idx;
                    const method = String(route.method || 'GET').toUpperCase();
                    const rawEndpoint = String(route.endpoint || '/');
                    const endpoint = rawEndpoint;
                    const featureName = getDisplayFeature(route.name || rawEndpoint);
                    const endpointFeature = getDisplayFeature(rawEndpoint);
                    const name = featureName === 'feature' ? endpointFeature : featureName;

                    const methodColor = method === 'GET' ? 'bg-neo-blue' : method === 'POST' ? 'bg-neo-pink' : 'bg-neo-red';
                    
                    let copyUrl = endpoint;
                    if (method === 'GET' && Array.isArray(route.params) && route.params.length > 0) {
                        copyUrl = endpoint + '?' + route.params.map(p => encodeURIComponent(p.name) + '=').join('&');
                    }

                    let inputs = '';
                    if (Array.isArray(route.params) && route.params.length) {
                        inputs = '<div class="params-box-mobile bg-white p-4 border-y-2 border-black grid gap-3 w-full">' +
                            route.params.map(p => {
                                const inputId = ('input-' + id + '-' + p.name).replace(/\s+/g, '-');
                                const value = p.example || p.default || getExampleValue(p);
                                const placeholder = p.example || p.default || p.description || getExampleValue(p);

                                return `
                                    <div class="min-w-0">
                                        <label class="text-[10px] font-black text-black uppercase tracking-widest mb-1.5 flex items-center gap-1.5">
                                            <span class="w-1.5 h-1.5 bg-black inline-block"></span>
                                            ${escapeHtml(p.name)} ${p.required ? '<span class="text-neo-red">*</span>' : ''}
                                        </label>
                                        <input type="text" id="${escapeHtml(inputId)}" data-param-name="${escapeHtml(p.name)}" placeholder="${escapeHtml(placeholder)}" value="${escapeHtml(value)}" class="w-full min-w-0 border-2 border-black p-2.5 text-xs font-bold rounded-none focus:outline-none focus:bg-neo-yellow bg-white shadow-neo-sm focus:shadow-neo focus:translate-x-[-2px] focus:translate-y-[-2px] transition-all">
                                    </div>`;
                            }).join('') + '</div>';
                    }

                    const card = document.createElement('div');
                    card.className = 'api-card-wrapper w-full bg-white border-2 border-black hover:-translate-y-1 hover:-translate-x-1 transition-all duration-200 overflow-hidden shadow-neo hover:shadow-neo-lg';
                    card.dataset.search = (name + ' ' + endpointFeature + ' ' + rawEndpoint + ' ' + cat).toLowerCase();

                    card.innerHTML = `
                        <div class="api-card-head p-3 cursor-pointer select-none hover:bg-[#f4f0ea] transition-colors border-b-2 border-transparent" onclick="toggleCard('${id}', this)">
                            <div class="flex justify-between items-center gap-2">
                                <div class="flex items-center gap-3 overflow-hidden min-w-0">
                                    <span class="method-badge-mobile px-2 py-1 text-[10px] font-black text-black ${methodColor} border-2 border-black font-mono tracking-wider w-14 text-center shadow-neo-sm shrink-0 uppercase">${escapeHtml(method)}</span>
                                    <div class="flex flex-col min-w-0">
                                        <code class="font-black text-[13px] sm:text-[15px] truncate font-mono text-black">${escapeHtml(name)}</code>
                                        <span class="api-name-text text-[10px] text-black font-bold truncate bg-neo-yellow border border-black px-1.5 py-0.5 mt-1 inline-block w-fit shadow-[1px_1px_0px_0px_rgba(0,0,0,1)] uppercase tracking-wider">${escapeHtml(method)} feature</span>
                                    </div>
                                </div>
                                <div class="w-6 h-6 border-2 border-black flex items-center justify-center bg-white shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] shrink-0">
                                    <i id="icon-${id}" class="fa-solid fa-plus text-[10px] text-black transition-transform duration-300"></i>
                                </div>
                            </div>
                        </div>

                        <div id="body-${id}" class="hidden w-full border-t-2 border-black">
                            ${inputs}

                            <div class="status-guide-wrap px-4 pt-4 hidden md:block">
                                <div class="bg-neo-bg border-2 border-black p-3 text-xs font-bold text-black shadow-neo-sm">
                                    <div class="flex items-center gap-2 mb-3 bg-white border-2 border-black p-2 w-fit shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]">
                                        <i class="fa-solid fa-circle-info"></i>
                                        <span class="uppercase tracking-widest">HTTP Status</span>
                                    </div>
                                    <div class="grid grid-cols-2 gap-x-4 gap-y-2 font-mono text-[11px]">
                                        <p><span class="bg-neo-green border border-black px-1 mr-1">200</span> OK</p>
                                        <p><span class="bg-neo-red text-white border border-black px-1 mr-1">400</span> Bad Req</p>
                                        <p><span class="bg-neo-red text-white border border-black px-1 mr-1">401</span> Unauth</p>
                                        <p><span class="bg-neo-red text-white border border-black px-1 mr-1">404</span> Not Found</p>
                                    </div>
                                </div>
                            </div>

                            <div class="action-row-mobile p-4 flex gap-3 bg-white w-full items-center">
                                <button id="btn-exec-${id}" onclick="testReq(this, '${escapeHtml(endpoint)}', '${escapeHtml(method)}', '${id}')" class="flex-1 h-12 bg-neo-yellow border-2 border-black font-black text-xs tracking-widest shadow-neo hover:bg-[#facc15] active:shadow-none active:translate-x-[4px] active:translate-y-[4px] transition-all flex items-center justify-center gap-2 uppercase">
                                    <i class="fa-solid fa-bolt"></i> <span class="btn-text">Execute</span>
                                </button>

                                <button onclick="copyFullUrl('${escapeHtml(copyUrl)}')" class="copy-full-url-btn w-12 h-12 border-2 border-black bg-white hover:bg-neo-blue text-black shadow-neo active:shadow-none active:translate-x-[4px] active:translate-y-[4px] transition-all flex items-center justify-center text-lg" title="Copy Full URL">
                                    <i class="fa-regular fa-copy"></i>
                                </button>
                            </div>

                            <div id="res-area-${id}" class="response-area hidden mx-4 mb-4 border-2 border-black bg-white shadow-neo relative max-w-[calc(100%-2rem)]">
                                <div class="response-toolbar">
                                    <div class="flex items-center gap-2 text-black font-black text-xs uppercase tracking-widest">
                                        <span class="w-8 h-8 bg-black text-white flex items-center justify-center shadow-[2px_2px_0px_0px_#ffde59]">
                                            <i class="fa-solid fa-code"></i>
                                        </span>
                                        <span>Result</span>
                                    </div>

                                    <div class="response-meta">
                                        <span id="status-indicator-${id}" class="status-indicator status-waiting"></span>
                                        <span id="status-${id}" class="text-[10px] font-mono font-black text-black tracking-widest">IDLE</span>
                                        <span id="time-${id}" class="text-[10px] font-mono font-bold text-black border-l-2 border-black pl-2 ml-1">0ms</span>
                                    </div>
                                </div>

                                <div class="response-action-grid px-4 pt-3 grid grid-cols-3 gap-3">
                                    <button onclick="copyEndpoint('${escapeHtml(endpoint)}')" class="copy-mini-btn hover:bg-neo-yellow">
                                        <i class="fa-regular fa-copy"></i> ENDPOINT
                                    </button>
                                    <button onclick="copyRequest('${escapeHtml(endpoint)}', '${escapeHtml(method)}', '${id}')" class="copy-mini-btn hover:bg-neo-blue">
                                        <i class="fa-solid fa-terminal"></i> REQUEST
                                    </button>
                                    <button onclick="copyRes('${id}')" class="copy-mini-btn hover:bg-neo-pink">
                                        <i class="fa-regular fa-clone"></i> COPY ALL
                                    </button>
                                </div>

                                <div class="request-url-box">
                                    <div class="label">
                                        <i class="fa-solid fa-link"></i>
                                        <span>Request URL</span>
                                    </div>
                                    <code id="request-line-${id}">curl -X ${escapeHtml(method)} ${escapeHtml(endpoint)}</code>
                                </div>

                                <div class="response-output-box custom-scrollbar font-mono text-[11px]">
                                    <div id="output-${id}" class="text-black break-all whitespace-pre-wrap leading-relaxed"></div>
                                </div>
                            </div>
                        </div>`;

                    grid.appendChild(card);
                });

                container.appendChild(section);
            });
        }

        function setActiveSidebarCategory(btn) {
            document.querySelectorAll('.sidebar-category-btn').forEach(el => el.classList.remove('active'));
            if (btn) btn.classList.add('active');
        }

        function showAllCategories(btn) {
            activeCategoryId = 'all';
            setActiveSidebarCategory(btn);
            document.querySelectorAll('.api-section').forEach(section => section.classList.remove('hidden'));
            
            const input = document.getElementById('search-input');
            if (input) input.value = '';
            
            hideNoResults();
            closeSidebar();
        }

        function filterCategory(sectionId, btn) {
            activeCategoryId = sectionId;
            setActiveSidebarCategory(btn);
            
            document.querySelectorAll('.api-section').forEach(section => {
                section.classList.toggle('hidden', section.id !== sectionId);
            });
            
            const input = document.getElementById('search-input');
            if (input) input.value = '';
            
            hideNoResults();
            closeSidebar();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleCard(id, headEl) {
            const body = document.getElementById('body-' + id);
            const icon = document.getElementById('icon-' + id);
            if (!body || !icon) return;

            const isHidden = body.classList.contains('hidden');
            body.classList.toggle('hidden', !isHidden);
            
            if (isHidden) {
                headEl.classList.add('border-black', 'bg-[#f4f0ea]');
                headEl.classList.remove('border-transparent');
                icon.parentElement.classList.add('bg-neo-yellow');
                icon.parentElement.classList.remove('bg-white');
            } else {
                headEl.classList.remove('border-black', 'bg-[#f4f0ea]');
                headEl.classList.add('border-transparent');
                icon.parentElement.classList.remove('bg-neo-yellow');
                icon.parentElement.classList.add('bg-white');
            }

            icon.classList.toggle('fa-plus', !isHidden);
            icon.classList.toggle('fa-minus', isHidden);
            icon.classList.toggle('rotate-180', isHidden);
        }

        function hideNoResults() {
            const noResults = document.getElementById('no-results');
            if (!noResults) return;
            noResults.classList.add('hidden');
            noResults.classList.remove('flex');
        }

        function showNoResults() {
            const noResults = document.getElementById('no-results');
            if (!noResults) return;
            noResults.classList.remove('hidden');
            noResults.classList.add('flex');
        }

        function setSearch() {
            const input = document.getElementById('search-input');
            if (!input) return;

            input.addEventListener('input', e => {
                const val = e.target.value.toLowerCase().trim();
                let anyVisible = false;

                document.querySelectorAll('.api-section').forEach(section => {
                    const allowedByCategory = activeCategoryId === 'all' || section.id === activeCategoryId;
                    let matchCount = 0;

                    section.querySelectorAll('.api-card-wrapper').forEach(card => {
                        const match = !val || card.dataset.search.includes(val);
                        card.classList.toggle('hidden', !match);
                        if (match) matchCount++;
                    });

                    const sectionVisible = allowedByCategory && matchCount > 0;
                    section.classList.toggle('hidden', !sectionVisible);
                    if (sectionVisible) anyVisible = true;
                });

                if (anyVisible) {
                    hideNoResults();
                } else {
                    showNoResults();
                }
            });
        }

        function messeg(msg) {
            const toast = document.getElementById('custom-toast');
            const msgBox = document.getElementById('toast-message');
            if (!toast || !msgBox) return;

            msgBox.innerText = msg;
            toast.classList.remove('translate-y-32', 'opacity-0');

            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.add('translate-y-32', 'opacity-0');
            }, 2500);
        }

        function copyFullUrl(path) {
            navigator.clipboard.writeText(window.location.origin + path);
            messeg('URL COPIED');
        }

        function copyEndpoint(endpoint) {
            navigator.clipboard.writeText(endpoint);
            messeg('ENDPOINT COPIED');
        }

        function copyRequest(endpoint, method, id) {
            const line = document.getElementById('request-line-' + id);
            navigator.clipboard.writeText(
                line?.innerText || ('curl -X ' + method + ' ' + window.location.origin + endpoint)
            );
            messeg('REQUEST COPIED');
        }

        function copyRes(id) {
            const out = document.getElementById('output-' + id);
            if (out?.innerText) {
                navigator.clipboard.writeText(out.innerText);
                messeg('RESPONSE COPIED');
            }
        }

        function cleanErrorBody(serverMessage) {
            let raw = String(serverMessage || '').trim();
            if (!raw) return '';
            const lower = raw.toLowerCase();

            const isHtmlOrCss = lower.includes('<!doctype html') || lower.includes('<html') || lower.includes('<head') || lower.includes('<body') || lower.includes('<style') || lower.includes('body, html') || lower.includes('background-color') || lower.includes('display: flex') || lower.includes('justify-content') || lower.includes('align-items') || lower.includes('margin: 0') || lower.includes('padding: 0');
            if (isHtmlOrCss) return '';

            try {
                const parsed = JSON.parse(raw);
                if (parsed && typeof parsed === 'object') {
                    return String(parsed.error || parsed.message || parsed.msg || parsed.reason || '').trim().slice(0, 120);
                }
            } catch (e) {}

            raw = raw.split('\n').join(' ').split('\r').join(' ').split('\t').join(' ');
            while (raw.includes('  ')) raw = raw.split('  ').join(' ');
            return raw.trim().slice(0, 120);
        }

        function getErrorMessage(code, statusText, serverMessage) {
            const serverText = cleanErrorBody(serverMessage);
            const messages = {
                400: '400 Bad Request - Input atau parameter salah.',
                401: '401 Unauthorized - API key/token salah atau belum dikirim.',
                403: '403 Forbidden - Akses endpoint ditolak.',
                404: '404 Not Found - Endpoint atau URL salah.',
                408: '408 Timeout - Server terlalu lama merespons.',
                415: '415 Unsupported Media Type - Format request salah.',
                422: '422 Validation Error - Format input tidak sesuai.',
                429: '429 Too Many Requests - Terlalu banyak request.',
                500: '500 Server Error - Server error atau input membuat proses gagal.',
                502: '502 Bad Gateway - Server tujuan bermasalah.',
                503: '503 Service Unavailable - Server sedang mati atau maintenance.',
                504: '504 Gateway Timeout - Server tujuan terlalu lama merespons.',
                505: '505 HTTP Version Not Supported - Versi HTTP tidak didukung.'
            };

            if (serverText) return serverText;
            if (code === 'NETWORK') return 'Network Error - Gagal terhubung ke server.';
            return messages[Number(code)] || (String(code) + ' ' + (statusText || 'Request Failed') + ' - Request gagal diproses.');
        }

        function normalizeApiResponse(data, isSuccess, responseTime) {
            if (data && typeof data === 'object' && !Array.isArray(data)) {
                const cloned = { ...data };
                delete cloned.author; delete cloned.creator; delete cloned.timestamp; delete cloned.response_time;
                return {
                    status: typeof data.status === 'undefined' ? isSuccess : data.status,
                    creator: 'Barikzz',
                    ...cloned,
                    timestamp: new Date().toISOString(),
                    response_time: responseTime + 'ms'
                };
            }
            return {
                status: isSuccess, creator: 'Barikzz', result: data,
                timestamp: new Date().toISOString(), response_time: responseTime + 'ms'
            };
        }

        function renderCleanError(code, statusText, serverMessage, responseTime) {
            return syntaxHighlight({
                status: false,
                creator: 'Barikzz',
                error: getErrorMessage(code, statusText, serverMessage),
                timestamp: new Date().toISOString(),
                response_time: responseTime + 'ms'
            });
        }

        async function testReq(btn, url, method, id) {
            if (btn.disabled) return;

            const out = document.getElementById('output-' + id);
            const status = document.getElementById('status-' + id);
            const time = document.getElementById('time-' + id);
            const resArea = document.getElementById('res-area-' + id);
            const statusIndicator = document.getElementById('status-indicator-' + id);

            if (!out || !status || !time || !resArea || !statusIndicator) return;

            const btnTextEl = btn.querySelector('.btn-text');
            const originalBtnText = btnTextEl.innerText;

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> <span class="btn-text">PROCESSING</span>';

            resArea.classList.remove('hidden', 'success', 'error');
            statusIndicator.className = 'status-indicator status-waiting';
            status.innerText = 'RUNNING...';
            status.className = 'text-[10px] font-mono font-black text-black tracking-widest';

            out.innerHTML = `
                <div class="flex items-center gap-3 text-black font-black uppercase bg-neo-bg border-2 border-black p-3 shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] w-fit">
                    <i class="fa-solid fa-circle-notch fa-spin text-lg"></i>
                    <span>Establishing Connection...</span>
                </div>`;

            const params = {};
            document.querySelectorAll('[id^="input-' + id + '-"]').forEach(input => {
                if (input.value) {
                    params[input.dataset.paramName || input.id.split('input-' + id + '-')[1]] = input.value;
                }
            });

            const fetchUrl = url + (method === 'GET' && Object.keys(params).length ? '?' + new URLSearchParams(params) : '');
            const fullRequestUrl = window.location.origin + fetchUrl;
            const requestLine = document.getElementById('request-line-' + id);

            if (requestLine) {
                requestLine.innerText = method === 'GET'
                    ? 'curl -X GET "' + fullRequestUrl + '"'
                    : 'curl -X ' + method + ' "' + window.location.origin + url + '" -H "Content-Type: application/json" -d \'' + JSON.stringify(params) + '\'';
            }

            const opts = {
                method: method,
                ...(method !== 'GET' ? { headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(params) } : {})
            };

            const start = Date.now();

            try {
                const req = await fetch(fetchUrl, opts);
                const duration = Date.now() - start;

                time.innerText = duration + 'ms';

                if (req.ok) {
                    statusIndicator.className = 'status-indicator status-success';
                    status.innerText = req.status + ' ' + req.statusText;
                    status.className = 'text-[10px] font-mono font-black text-neo-green bg-black px-2 tracking-widest';
                    resArea.classList.add('success');
                } else {
                    statusIndicator.className = 'status-indicator status-error';
                    status.innerText = req.status + ' ' + req.statusText;
                    status.className = 'text-[10px] font-mono font-black text-white bg-neo-red px-2 tracking-widest';
                    resArea.classList.add('error');
                }

                const type = req.headers.get('content-type') || '';

                if (!req.ok) {
                    let errorBody = '';
                    try {
                        errorBody = type.includes('json') ? JSON.stringify(await req.json()) : await req.text();
                    } catch (e) {}

                    out.innerHTML = renderCleanError(req.status, req.statusText, errorBody, duration);
                    return;
                }

                if (type.includes('json')) {
                    const json = normalizeApiResponse(await req.json(), true, duration);
                    out.innerHTML = syntaxHighlight(json);
                } else if (type.startsWith('image')) {
                    const blob = await req.blob();
                    const imageUrl = URL.createObjectURL(blob);
                    out.innerHTML = `
                        <div class="flex justify-center p-2 bg-white border-2 border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] w-fit mx-auto mt-2 mb-2">
                            <img src="${imageUrl}" class="max-w-full max-h-[240px]">
                        </div>`;
                } else {
                    const text = await req.text();
                    out.innerHTML = escapeHtml(text);
                }
            } catch (err) {
                const duration = Date.now() - start;
                time.innerText = duration + 'ms';
                statusIndicator.className = 'status-indicator status-error';
                status.innerText = 'ERROR';
                status.className = 'text-[10px] font-mono font-black text-white bg-neo-red px-2 tracking-widest';
                resArea.classList.add('error');
                out.innerHTML = renderCleanError('NETWORK', err.message, '', duration);
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-bolt"></i> <span class="btn-text">` + originalBtnText + `</span>`;
            }
        }

        function syntaxHighlight(json) {
            if (typeof json !== 'string') {
                json = JSON.stringify(json, null, 2);
            }
            json = escapeHtml(json);
            return json.replace(
                /(&quot;(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\&])*&quot;(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
                function(match) {
                    let cls = 'json-number';
                    if (match.startsWith('&quot;')) {
                        cls = match.endsWith(':') ? 'json-key' : 'json-string';
                    } else if (match === 'true' || match === 'false') {
                        cls = 'json-boolean';
                    } else if (match === 'null') {
                        cls = 'json-null';
                    }
                    return '<span class="' + cls + '">' + match + '</span>';
                }
            );
        }
    </script>
